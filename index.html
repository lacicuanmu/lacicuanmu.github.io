<style>
:root{
 --bg:#F5F3EC;--card:#FFFEFA;--tx:#303A35;--mu:#778078;--pr:#61786A;
 --sage:#718779;--pl:#DCE4DA;--gold:#C29A3C;--gold-soft:#F3E2AF;
 --gr:#39815E;--rd:#B96A60;--line:#E8E5DC;
 --sh:0 8px 28px rgba(48,58,53,.065);--sh2:0 3px 12px rgba(48,58,53,.05);
 color-scheme:light
}
:root[data-theme="dark"]{
 --bg:#171D19;--card:#222B25;--tx:#F0F2EC;--mu:#A9B2AA;--pr:#AFC2B2;
 --sage:#AFC2B2;--pl:#303E34;--gold:#D5B66B;--gold-soft:#4A4029;--gr:#83C99A;--rd:#F08C7C;--line:#39463D;
 --sh:0 8px 28px rgba(0,0,0,.18);--sh2:0 3px 12px rgba(0,0,0,.13);color-scheme:dark
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:18px}
body{margin:0 auto;max-width:560px;min-height:100dvh;padding:22px 18px calc(126px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--tx);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--pr) 24%,transparent);outline-offset:2px}
h1{margin:0;font-size:34px;line-height:1.13;font-weight:800;letter-spacing:-1.35px}
h2{margin:0;font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.6px}
small{font-size:13px}
#app{min-height:70vh}
.card,.panel,.metric-card,.home-recent{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.card,.panel{border-radius:24px;padding:19px;margin-bottom:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid,.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{min-width:0;padding:17px;border:1px solid var(--line);border-radius:21px;background:var(--card);color:var(--mu);font-size:13px;box-shadow:var(--sh2)}
.stat b{display:block;margin-top:8px;color:var(--tx);font-size:22px;line-height:1.25;letter-spacing:-.65px;overflow-wrap:anywhere}
.btn{min-height:48px;padding:12px 17px;border:0;border-radius:16px;background:var(--pr);color:#fff;font-size:14px;font-weight:750;box-shadow:0 5px 13px rgba(97,120,106,.18);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.97)}
.btn.sec{background:var(--pl);color:var(--pr);box-shadow:none}
.btn.full{width:100%}.btn.del{min-height:32px;padding:5px 9px;background:transparent;color:var(--rd);box-shadow:none;font-size:12px}
input,select{width:100%;min-height:54px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--pl)}
label{display:block;margin:17px 0 8px;color:var(--mu);font-size:14px;font-weight:750}
.seg{display:flex;gap:5px;padding:5px;border-radius:18px;background:var(--pl)}
.seg button{flex:1;min-height:48px;padding:10px;border:0;border-radius:14px;background:transparent;color:var(--mu);font-size:15px;font-weight:750}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:var(--sh2)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{min-height:44px;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--tx);font-size:14px;font-weight:700}
.chip.on{border-color:#B8C8BA;background:var(--pl);color:var(--pr)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li small{display:block;margin-top:4px;color:var(--mu);font-size:13px}
.pos{color:var(--gr)}.neg{color:var(--rd)}.sum{font-weight:800}
.empty{padding:26px 12px;color:var(--mu);text-align:center;font-size:14px}
.empty-state{padding:28px 15px;color:var(--mu);text-align:center;font-size:14px;line-height:1.6}
.empty-state strong{display:block;margin-bottom:5px;color:var(--tx);font-size:16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:5px 1px 24px}
.page-kicker{display:block;margin-bottom:7px;color:var(--mu);font-size:13px;font-weight:800;letter-spacing:.075em}
.page-title{font-size:36px;letter-spacing:-1.5px}
.page-subtitle{margin-top:8px;color:var(--mu);font-size:15px;line-height:1.5}
.page-pill{flex-shrink:0;margin-top:0;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mu);font-size:13px;font-weight:750}
.section-title,.home-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:27px 2px 14px}
.section-title h2,.home-section-head h2{font-size:21px}
.section-title small,.home-section-head small{color:var(--mu);font-size:13px;font-weight:700}
.metric-card{min-width:0;padding:17px;border-radius:22px;box-shadow:var(--sh2)}
.metric-label{display:flex;align-items:center;gap:9px;color:var(--mu);font-size:13px;font-weight:750;line-height:1.35}
.metric-icon{display:grid;width:36px;height:36px;flex:0 0 36px;place-items:center;border-radius:13px;background:var(--pl);font-size:17px}
.metric-value{display:block;margin-top:11px;font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.7px;overflow-wrap:anywhere}
.page-tabs{display:flex;gap:9px;overflow-x:auto;padding:3px 1px 14px;scrollbar-width:none}
.page-tabs::-webkit-scrollbar{display:none}
.page-tab{flex:0 0 auto;min-height:46px;padding:11px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mu);font-family:inherit;font-size:15px;font-weight:700}
.page-tab.active{border-color:var(--pr);background:var(--pr);color:white}
.panel-flat{padding:5px 19px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--sh)}
.tx-row{display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid var(--line)}
.tx-row:last-child{border-bottom:0}
.tx-symbol{display:grid;width:48px;height:48px;flex:0 0 48px;place-items:center;border-radius:17px;background:var(--pl);color:var(--pr);font-size:21px;font-weight:800}
.tx-main{min-width:0;flex:1}
.tx-title{overflow:hidden;color:var(--tx);font-size:16px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{overflow:hidden;margin-top:5px;color:var(--mu);font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.tx-side{flex-shrink:0;text-align:right}.tx-amount{font-size:16px;font-weight:800;white-space:nowrap}
.tx-side .btn.del{display:block;margin:4px 0 0 auto;min-height:27px;padding:3px 8px;border:1px solid var(--line);border-radius:9px;color:var(--mu);font-size:11px}
.report-hero,.hero{margin:0 0 15px;padding:25px 22px;border:0;border-radius:28px;background:linear-gradient(145deg,#829889 0%,#61786A 72%,#4F6558 100%);color:#fff;box-shadow:0 15px 34px rgba(79,101,88,.19)}
.report-hero .eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;color:rgba(255,255,255,.75)}
.report-hero .value,.big{margin:8px 0;font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-1.8px;overflow-wrap:anywhere}
.report-hero .hint{color:rgba(255,255,255,.75);font-size:14px}
.report-hero .mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;padding-top:17px;border-top:1px solid rgba(255,255,255,.2)}
.report-hero .mini span{display:block;color:rgba(255,255,255,.7);font-size:13px}
.report-hero .mini b{display:block;margin-top:5px;font-size:20px}
.bars{display:flex;height:175px;align-items:flex-end;gap:10px;padding-top:12px}
.bars>div{display:flex;height:100%;flex:1;flex-direction:column;align-items:center;justify-content:flex-end;color:var(--mu);font-size:12px}
.pair{display:flex;width:100%;height:calc(100% - 20px);align-items:flex-end;gap:3px}.pair i{flex:1}
.report-chart{display:flex;height:175px;align-items:flex-end;gap:10px;padding-top:12px}
.report-chart>div{display:flex;height:100%;flex:1;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;color:var(--mu);font-size:12px}
.report-chart .bars-pair{display:flex;width:100%;height:calc(100% - 20px);align-items:flex-end;gap:3px}
.report-chart i{min-height:2px;flex:1;border-radius:7px 7px 2px 2px}
.report-legend{display:flex;flex-wrap:wrap;gap:17px;margin-top:15px;color:var(--mu);font-size:13px}
.report-legend span{display:flex;align-items:center;gap:6px}.legend-dot{width:9px;height:9px;border-radius:50%;background:var(--pr)}.legend-dot.profit{background:var(--gr)}
.breakdown-row{display:flex;justify-content:space-between;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);font-size:14px}
.breakdown-row:last-child{border:0}.breakdown-row b{font-weight:750;white-space:nowrap}.breakdown-row.total{font-size:16px;font-weight:800}
.manage-group{margin:27px 2px 12px;color:var(--mu);font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.manage-item{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.manage-item:last-child{border-bottom:0}
.manage-icon{display:grid;width:49px;height:49px;flex:0 0 49px;place-items:center;border-radius:17px;background:var(--pl);font-size:22px}
.manage-copy{min-width:0;flex:1}.manage-copy b{display:block;font-size:16px;line-height:1.4}.manage-copy small{display:block;margin-top:4px;color:var(--mu);font-size:14px;line-height:1.45}
.manage-item .btn{min-height:43px;padding:9px 15px;border-radius:14px;font-size:13px}
.settings-theme{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--pl)}
.settings-theme button{flex:1;padding:11px 7px;border:0;border-radius:12px;background:transparent;color:var(--mu);font-size:13px;font-weight:750}
.settings-theme button.on{background:var(--card);color:var(--pr);box-shadow:var(--sh2)}
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 1px 25px}
.home-greet{display:block;color:var(--mu);font-size:16px;font-weight:600}
.home-brand{margin:5px 0 0;font-size:39px;line-height:1.1;letter-spacing:-1.8px}
.home-month{flex-shrink:0;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mu);font-size:13px;font-weight:800}
.home-hero{position:relative;overflow:hidden;margin-bottom:20px;padding:27px 24px 23px;border-radius:31px;background:linear-gradient(145deg,#829889 0%,#61786A 72%,#4F6558 100%);color:white;box-shadow:0 17px 36px rgba(79,101,88,.19)}
.home-hero:before{position:absolute;top:-95px;right:-77px;width:210px;height:210px;border:1px solid rgba(255,255,255,.1);border-radius:50%;content:"";box-shadow:0 0 0 24px rgba(255,255,255,.025),0 0 0 50px rgba(255,255,255,.02)}
.home-hero-top,.home-hero-main,.home-hero-bottom{position:relative;z-index:1}
.home-hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.home-eyebrow{color:rgba(255,255,255,.72);font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.home-month-name{margin-top:5px;color:rgba(255,255,255,.92);font-size:17px;font-weight:700}
/* Uiverse.io by Type-Delta — switch visibilitas nominal */
.reduceMotionToggle{width:4em;height:auto;color:rgba(255,255,255,.9)}
.st-reduceMotionToggleBtn{position:relative;display:inline-block;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.st-reduceMotionToggleBtn .reduceMotionToggleInput{position:relative;display:block;opacity:0;width:inherit;height:auto;min-height:0;aspect-ratio:1;margin:0;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer}
.st-reduceMotionToggleBtn svg{position:absolute;top:0;left:0;width:inherit;height:inherit;pointer-events:none;overflow:visible}
.st-reduceMotionToggleBtn svg .line{transform:scaleX(0)}
.st-reduceMotionToggleBtn .reduceMotionToggleInput:not(:checked)+svg .ballTrace{animation:ballTrace_toggleMotionOff9371A .3s ease 0s 1 forwards,ballTrace_toggleMotionOff9371B .1s steps(2,end) calc(.32s + var(--_appearOffset)) 1 forwards}
.st-reduceMotionToggleBtn .reduceMotionToggleInput:not(:checked)+svg .ball{animation:ball_toggleMotionOn9371A .3s ease 0s 1 forwards,ball_toggleMotionOn9371B .4s cubic-bezier(.165,.84,.45,1.11) .3s 1 forwards}
.st-reduceMotionToggleBtn .reduceMotionToggleInput:checked+svg circle{animation:ball_toggleMotionOff9371 .9s linear 0s 1 forwards}
.st-reduceMotionToggleBtn .reduceMotionToggleInput:checked+svg .line{animation:line_toggleMotionOff9371 .32s cubic-bezier(.075,.82,.165,1) .47s 1 forwards}
.st-reduceMotionToggleBtn:focus-within{outline:2px solid rgba(255,255,255,.75);outline-offset:4px;border-radius:50%}
@keyframes ball_toggleMotionOff9371{0%{transform:translateX(0)}6.66%{transform:translateX(calc(var(--_toCenterXOffset)*.45))}13.33%{transform:translateX(calc(var(--_toCenterXOffset)*.77))}20%{transform:translateX(calc(var(--_toCenterXOffset)*.9))}26.66%{transform:translateX(calc(var(--_toCenterXOffset)*.94))}33.33%{transform:translate(calc(var(--_toCenterXOffset)*.965 + 1px),2px)}35%{transform:translate(calc(var(--_toCenterXOffset)*.988),1px)}37%{transform:translate(calc(var(--_toCenterXOffset)*.991 + 1px),-1px)}39%{transform:translate(calc(var(--_toCenterXOffset)*.995 - 1px),-2px)}41%{transform:translate(calc(var(--_toCenterXOffset)*.999 + 1px),-1px)}43%{transform:translate(calc(var(--_toCenterXOffset)*.75),1px)}45%{transform:translate(calc(var(--_toCenterXOffset)*.5),0)}100%{transform:translate(calc(var(--_toCenterXOffset)*.5),0)}}
@keyframes line_toggleMotionOff9371{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes ball_toggleMotionOn9371A{0%{transform:translate(calc(var(--_toCenterXOffset)*.5),0)}100%{transform:translate(calc(var(--_toCenterXOffset) - 5.67px),0)}}
@keyframes ball_toggleMotionOn9371B{0%{transform:translate(calc(var(--_toCenterXOffset) - 5.67px),0)}100%{transform:translate(0,0)}}
@keyframes ballTrace_toggleMotionOff9371A{0%{opacity:1;transform:translate(calc(var(--_toCenterXOffset)*.5),0)}99.9%{opacity:1;transform:translate(calc(var(--_toCenterXOffset) - 5.67px),0)}100%{opacity:0;transform:translate(calc(var(--_toCenterXOffset) - 5.67px),0)}}
@keyframes ballTrace_toggleMotionOff9371B{0%{opacity:0;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){.st-reduceMotionToggleBtn *{animation:none!important;transition:none!important}}

.home-hero-main{padding:25px 0 20px}.home-hero-label{color:rgba(255,255,255,.76);font-size:17px;font-weight:650}
.home-amount{margin:7px 0;font-size:clamp(37px,9vw,46px);line-height:1.12;font-weight:800;letter-spacing:-2px;overflow-wrap:anywhere}
.home-hero-note{color:rgba(255,255,255,.73);font-size:15px}
.home-hero-bottom{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding-top:19px;border-top:1px solid rgba(255,255,255,.2)}
.home-hero-metric span{display:block;margin-bottom:5px;color:rgba(255,255,255,.7);font-size:14px}
.home-hero-metric b{font-size:22px;letter-spacing:-.5px;overflow-wrap:anywhere}

.home-today-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Animated Laci Cuanmu welcome screen */
#brand-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:28px;background:#F5F3EC;color:#303A35;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}
#brand-splash.out{opacity:0;visibility:hidden;pointer-events:none}
#brand-splash .brand-art{width:min(54vw,210px);height:auto;overflow:visible;filter:drop-shadow(0 15px 18px rgba(48,58,53,.13))}
#brand-splash .drawer{transform-origin:50% 72%;animation:drawer-float 2.4s ease-in-out infinite}
#brand-splash .coin{transform-box:fill-box;transform-origin:center;animation:coin-bob 1.65s ease-in-out infinite}
#brand-splash .coin.c2{animation-delay:.22s}
#brand-splash .coin.c3{animation-delay:.43s}
#brand-splash .spark{transform-box:fill-box;transform-origin:center;animation:sparkle 1.8s ease-in-out infinite}
#brand-splash .spark.s2{animation-delay:.65s}
#brand-splash .brand-name{font-family:"Nunito","Plus Jakarta Sans",sans-serif;font-size:clamp(27px,7vw,35px);font-weight:800;letter-spacing:-.7px;color:#303A35;animation:name-in .8s cubic-bezier(.2,.75,.25,1) both}

@keyframes drawer-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes coin-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(8deg)}}
@keyframes sparkle{0%,100%{opacity:.55;transform:scale(.82)}50%{opacity:1;transform:scale(1.12)}}

/* Laci Cuanmu theme switch — ON = terang (matahari kiri), OFF = gelap (bulan kanan) */
.lcm-theme-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0 12px}
.lcm-theme-state{color:var(--mu);font-size:14px;font-weight:750}
.lcm-theme{display:inline-flex;align-items:center;margin:0;padding:0;-webkit-tap-highlight-color:transparent;cursor:pointer}
.lcm-theme__toggle-wrap{position:relative;display:block;width:56px;height:30px;flex:0 0 56px}
.lcm-theme__toggle{position:absolute;inset:0;z-index:2;display:block;box-sizing:border-box;width:56px;height:30px;min-height:30px;margin:0;padding:0;border:0;border-radius:999px;background:#263C50;box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 22%,transparent);appearance:none;-webkit-appearance:none;cursor:pointer;transition:background-color .3s,box-shadow .2s}
.lcm-theme__toggle:before{position:absolute;top:50%;left:4px;display:block;width:22px;height:22px;border-radius:50%;background:#AFC5D8;content:"";transform:translate(26px,-50%);transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .3s}
.lcm-theme__toggle:checked{background:#F4D77C}
.lcm-theme__toggle:checked:before{transform:translate(0,-50%);background:#E7A92F}
.lcm-theme__toggle:focus-visible{outline:3px solid var(--pr);outline-offset:4px}
.lcm-theme__icon{position:absolute;top:50%;left:7px;z-index:3;width:16px;height:16px;pointer-events:none;transform:translate(26px,-50%);transition:transform .3s}
.lcm-theme__icon-part{position:absolute;top:calc(50% - 6px);left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:transparent;box-shadow:3px -3px 0 2px #EAF2F8 inset;transform:scale(.9);transition:all .3s}
.lcm-theme__icon-part~.lcm-theme__icon-part{top:50%;left:calc(50% - 1px);width:2px;height:3px;border-radius:2px;background:#FFF8DF;box-shadow:none;transform:rotate(0deg) translateY(6px);transform-origin:50% 0;opacity:0;transition:opacity .2s,transform .3s}
.lcm-theme__icon-part:nth-child(3){transform:rotate(45deg) translateY(6px)}.lcm-theme__icon-part:nth-child(4){transform:rotate(90deg) translateY(6px)}.lcm-theme__icon-part:nth-child(5){transform:rotate(135deg) translateY(6px)}.lcm-theme__icon-part:nth-child(6){transform:rotate(180deg) translateY(6px)}.lcm-theme__icon-part:nth-child(7){transform:rotate(225deg) translateY(6px)}.lcm-theme__icon-part:nth-child(8){transform:rotate(270deg) translateY(6px)}.lcm-theme__icon-part:nth-child(9){transform:rotate(315deg) translateY(6px)}
.lcm-theme__toggle:checked~.lcm-theme__icon{transform:translate(0,-50%)}
.lcm-theme__toggle:checked~.lcm-theme__icon .lcm-theme__icon-part:first-child{top:calc(50% - 6px);left:calc(50% - 6px);width:12px;height:12px;background:#FFF8DF;box-shadow:none;transform:scale(1)}
.lcm-theme__toggle:checked~.lcm-theme__icon .lcm-theme__icon-part~.lcm-theme__icon-part{background:#A66D13;opacity:1}
.lcm-theme__fill{display:none}

<script>
const KEY="catatan-usaha-v1";
const def={name:"Usaha Saya",hide:false,
 products:[{id:"p1",name:"Produk contoh A",price:15000,cost:7000},{id:"p2",name:"Produk contoh B",price:20000,cost:9000}],
 platforms:[{id:"f1",name:"Shopee Food",fee:20},{id:"f2",name:"GoFood",fee:20},{id:"f3",name:"GrabFood",fee:20},{id:"f4",name:"WhatsApp / langsung",fee:0}],
 cats:["Bahan baku","Kemasan & perlengkapan","Operasional"],tx:[]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def}catch(e){S=def}
norm();
let localSaveWarningShown=false;
const persistLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localSaveWarningShown=false;return true}catch(e){if(!localSaveWarningShown){localSaveWarningShown=true;alert('Peringatan: penyimpanan data di HP gagal. Perubahan mungkin belum aman di perangkat ini. Jika Anda sudah login dan internet tersedia, aplikasi akan mencoba menyimpan ke cloud. Pastikan status Tersinkron sebelum menutup aplikasi. Periksa ruang penyimpanan HP bila masalah berulang.')}return false}};
const save=()=>{localRevision++;const ok=persistLocal();if(window.cloudPush)window.cloudPush();return ok};
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const mask=n=>S.hide?"Rp ••••••":rp(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let tab="home",rep=today().slice(0,7),listFilter="all",localRevision=0;

// Normalisasi nilai penjualan agar transaksi OCR dan manual memakai dasar yang sama.
const saleGross=t=>Number(t.originalGross!=null?t.originalGross:t.qty*t.price)||0;
const saleDiscount=t=>Number(t.discount)||0;
const saleRevenue=t=>Math.max(0,saleGross(t)-saleDiscount(t));
function calc(list){
 let gross=0,discount=0,revenue=0,fee=0,tax=0,porsi=0,buy=0,by={};
 S.cats.forEach(c=>by[c]=0);
 list.forEach(t=>{
  if(t.type==="sale"){
   gross+=saleGross(t);discount+=saleDiscount(t);revenue+=saleRevenue(t);
   fee+=Number(t.fee)||0;tax+=Number(t.tax)||0;porsi+=Number(t.qty)||0;
  }else{const amount=Number(t.amount)||0;buy+=amount;by[t.cat]=(by[t.cat]||0)+amount}
 });
 const net=revenue-fee,cash=net-tax;
 return{gross,discount,revenue,fee,tax,net,cash,porsi,buy,by,profit:net-buy};
}
const inMonth=m=>S.tx.filter(t=>t.date.slice(0,7)===m);
function newestFirst(list){return list.map((t,i)=>({t,i})).sort((a,b)=>b.t.date.localeCompare(a.t.date)||String(b.t.createdAt||"").localeCompare(String(a.t.createdAt||""))||b.i-a.i).map(x=>x.t)}

function render(){
 document.documentElement.dataset.page=tab;
 applyRec();
 $("#nav").innerHTML=[["home","⌂","Beranda"],["list","▤","Riwayat"],["add","＋",""],["rep","▥","Laporan"],["mgr","⚙","Kelola"]]
 .map(([k,i,l])=>k==="add"?`<button class="plus nav-add" aria-label="Tambah transaksi" onclick="openAdd()">${i}</button>`:`<button class="nav-item ${tab===k?"on":""}" aria-label="${l}" onclick="tab='${k}';render()"><span class="nav-icon">${i}</span><small>${l}</small></button>`).join("");
 ({home,list,rep:report,mgr:manage})[tab]();if(window.placeSyncPill)window.placeSyncPill();window.scrollTo(0,0);
}
function home(){
 const m=today().slice(0,7),M=calc(inMonth(m)),T=calc(S.tx.filter(t=>t.date===today())),mi=+m.slice(5)-1,recent=newestFirst(S.tx).slice(0,4);
 const recentHtml=recent.length?recent.map(t=>{const sale=t.type==="sale",title=sale?(t.qty+"× "+esc(t.name)):esc(t.cat),meta=esc(t.date)+(sale?" · "+esc(t.platform):t.note?" · "+esc(t.note):""),amount=sale?rp(t.qty*t.price-(t.fee||0)-(t.tax||0)):rp(t.amount);return '<div class="feed-row"><i class="'+(sale?"sale":"buy")+'">'+(sale?"↗":"↙")+'</i><span><b>'+title+'</b><small>'+meta+'</small></span><strong class="'+(sale?"pos":"neg")+'">'+(sale?"+":"−")+amount+'</strong></div>'}).join(""):'<div class="empty-state">Belum ada transaksi. Mulai catat aktivitas usahamu.</div>';
 $("#app").innerHTML='<header class="home-head compact-home"><div><small>RUANG USAHAMU</small><h1>'+esc(S.name)+'</h1><span>'+today().split("-").reverse().join("/")+'</span></div><div class="home-head-side"><b>'+MON[mi]+' '+m.slice(0,4)+'</b><div class="home-sync-slot" id="home-sync-slot"></div></div></header>'+
 '<section class="overview-v3"><div class="overview-label">LABA BERSIH BULAN INI'+
 '<label type="checkbox" class="reduceMotionToggle st-reduceMotionToggleBtn" for="reduceMotionToggleVisibility" title="Tampilkan atau sembunyikan nominal"><input class="reduceMotionToggleInput" id="reduceMotionToggleVisibility" type="checkbox" role="switch" aria-label="Tampilkan nominal" '+(S.hide?"checked":"")+' onchange="S.hide=this.checked;save();render()"><svg stroke-width="0" stroke="currentColor" fill="currentColor" viewBox="0 0 18 18" height="18" width="18" aria-hidden="true"><mask id="lineMaskVisibility"><rect fill="white" height="18" width="18"></rect><rect fill="black" style="rotate:30deg" height="16" width="4.1" y="-5" x="9.807" class="line"></rect></mask><rect style="rotate:30deg" height="13" width="1.3" y="-3.3" x="11.3" class="line"></rect><g mask="url(#lineMaskVisibility)"><circle style="--_toCenterXOffset:5.76px;--_appearOffset:-.1s" fill="none" stroke-width=".1" r="2.95" cy="9" cx="3.24" class="ballTrace"></circle><circle style="--_toCenterXOffset:3px;--_appearOffset:.02s" fill="none" stroke-width=".2" r="2.9" cy="9" cx="6" class="ballTrace"></circle><circle style="--_toCenterXOffset:0px;--_appearOffset:.07s" fill="none" stroke-width=".3" r="2.8" cy="9" cx="9" class="ballTrace"></circle><circle style="--_toCenterXOffset:-2.75px;--_appearOffset:.13s" fill="none" stroke-width=".4" r="2.75" cy="9" cx="11.75" class="ballTrace"></circle><circle style="--_toCenterXOffset:-5.7px" r="3" cy="9" cx="14.7" class="ball"></circle></g></svg></label></div>'+
 '<strong class="overview-value">'+mask(M.profit)+'</strong><small class="sage-period-sub">'+MONF[mi]+' '+m.slice(0,4)+'</small><div class="sage-bottom-row"><div class="overview-metrics"><div><small>Pendapatan bersih</small><b>'+mask(M.net)+'</b></div><div><small>Total belanja</small><b>'+mask(M.buy)+'</b></div></div><div class="sage-vertical-pill"><span class="sage-pill-count">'+M.porsi+'</span><span class="sage-pill-unit">porsi</span></div></div></section>'+
 '<section class="quick-v3"><div class="v3-heading"><b>Catat aktivitas</b><small>Akses cepat</small></div><div class="v3-actions"><button onclick="openAdd(\'sale\')"><i>↗</i><span><b>Penjualan</b><small>Tambah pemasukan</small></span><em>＋</em></button><button onclick="openAdd(\'buy\')"><i>↙</i><span><b>Belanja</b><small>Tambah pengeluaran</small></span><em>＋</em></button></div></section>'+
 '<section class="today-v3"><div class="v3-heading"><b>Hari ini</b><small>'+today().split("-").reverse().join("/")+'</small></div><div class="today-metrics"><div><small>Penjualan bersih</small><b>'+mask(T.net)+'</b></div><div><small>Belanja</small><b>'+mask(T.buy)+'</b></div><div><small>Laba</small><b>'+mask(T.profit)+'</b></div></div></section>'+
 '<section class="feed-v3"><div class="v3-heading"><b>Transaksi terbaru</b><button onclick="tab=\'list\';render()">Lihat semua →</button></div>'+recentHtml+'</section>';
}
function list(){
 const all=newestFirst(S.tx),a=listFilter==="all"?all:all.filter(t=>t.type===listFilter),sales=all.filter(t=>t.type==="sale").reduce((n,t)=>n+saleGross(t),0),buys=all.filter(t=>t.type==="buy").reduce((n,t)=>n+t.amount,0);
 const tabs=[["all","Semua"],["sale","Penjualan"],["buy","Belanja"]].map(x=>'<button class="page-tab '+(listFilter===x[0]?"active":"")+'" onclick="listFilter=\''+x[0]+'\';render()">'+x[1]+'</button>').join("");
 let last="";const rows=a.length?a.map(t=>{const sale=t.type==="sale",title=sale?(t.qty+"× "+esc(t.name)):esc(t.cat),meta=sale?esc(t.platform)+(t.fee?" · biaya "+rp(t.fee):"")+(t.tax?" · pajak "+rp(t.tax):""):esc(t.note||"Belanja usaha"),amount=sale?t.qty*t.price-(t.fee||0)-(t.tax||0):t.amount,date=t.date!==last?'<div class="history-day">'+esc(t.date.split("-").reverse().join("/"))+'</div>':"";last=t.date;return date+'<div class="history-line"><i class="'+(sale?"sale":"buy")+'">'+(sale?"↗":"↙")+'</i><div class="history-info"><b>'+title+'</b><small>'+meta+'</small><div><button onclick="editRemark(\''+t.id+'\')">Keterangan · '+(t.note?'Edit':'Tambah')+'</button>'+(t.evidence?'<button onclick="openEvidenceByTx(\''+t.id+'\')">Bukti</button>':"")+'</div></div><aside><b class="'+(sale?"pos":"neg")+'">'+(sale?"+":"−")+rp(amount)+'</b><button onclick="delTx(\''+t.id+'\')">Hapus</button></aside></div>'}).join(""):'<div class="empty-state"><strong>Belum ada transaksi</strong>Catatan penjualan dan belanja akan muncul di sini.</div>';
 $("#app").innerHTML='<header class="page-head"><div><span class="page-kicker">AKTIVITAS USAHA</span><h1 class="page-title">Riwayat</h1><div class="page-subtitle">Seluruh catatan transaksi usahamu.</div></div><span class="page-pill">'+all.length+' catatan</span></header>'+
 '<div class="history-totals"><div><small>Penjualan kotor</small><b>'+rp(sales)+'</b></div><i></i><div><small>Total belanja</small><b>'+rp(buys)+'</b></div></div><div class="v3-heading history-heading"><b>Aktivitas</b><small>Terbaru dahulu</small></div><div class="page-tabs">'+tabs+'</div><section class="history-stream">'+rows+'</section>';
}
function delTx(id){if(confirm('Hapus transaksi ini?')){const t=S.tx.find(x=>x.id===id);if(t&&t.rid){const r=S.rec.find(x=>x.id===t.rid)||S.staff.find(x=>x.id===t.rid);if(r){r.skip=r.skip||[];r.skip.push(t.rm)}}S.tx=S.tx.filter(x=>x.id!==id);save();render()}}
function editRemark(id){
 const t=S.tx.find(x=>x.id===id);if(!t)return;
 open(hd('Keterangan transaksi')+`<label>Keterangan (opsional)</label><textarea id="remark" rows="4" style="width:100%;min-height:110px;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);font:inherit">${esc(t.note||"")}</textarea><button class="btn full" style="margin-top:16px" onclick="saveRemark('${id}')">Simpan keterangan</button>`);
}
function openEvidenceByTx(id){const t=S.tx.find(x=>x.id===id);if(!t||!t.evidence)return alert('Bukti asli tidak ditemukan pada transaksi ini.');if(typeof window.openEvidence==='function')window.openEvidence(t.evidence);else alert('Fitur arsip belum siap. Muat ulang aplikasi.')}
function saveRemark(id){const t=S.tx.find(x=>x.id===id);if(!t)return;t.note=$("#remark").value.trim();save();close();render()}

function report(){
 const [y,mo]=rep.split("-").map(Number),months=[];for(let i=5;i>=0;i--){const d=new Date(y,mo-1-i,1);months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
 const data=months.map(m=>calc(inMonth(m))),mx=Math.max(1,...data.map(d=>Math.max(d.net,Math.abs(d.profit)))),M=calc(inMonth(rep)),gk=M.net-(M.by["Bahan baku"]||0)-(M.by["Kemasan & perlengkapan"]||0),other=S.cats.filter(c=>c!=="Bahan baku"&&c!=="Kemasan & perlengkapan"),pct=M.net>0?Math.round(gk/M.net*100):0,row=(a,b,cls)=>'<div class="statement-line '+(cls||"")+'"><span>'+a+'</span><b>'+b+'</b></div>';
 $("#app").innerHTML='<header class="page-head"><div><span class="page-kicker">ANALISIS KEUANGAN</span><h1 class="page-title">Laporan</h1><div class="page-subtitle">Ringkasan performa usaha.</div></div><span class="page-pill">Bulanan</span></header>'+
 '<div class="period-line"><button onclick="shift(-1)">‹</button><div><small>PERIODE LAPORAN</small><b>'+MONF[mo-1]+' '+y+'</b></div><button onclick="shift(1)">›</button></div>'+
 '<section class="report-overview"><small>ESTIMASI LABA BERSIH</small><strong>'+rp(M.profit)+'</strong><span>'+M.porsi+' porsi tercatat</span><div><p><small>Pendapatan bersih</small><b>'+rp(M.net)+'</b></p><p><small>Total belanja</small><b>'+rp(M.buy)+'</b></p></div></section>'+
 '<div class="report-facts"><div><small>Penjualan kotor</small><b>'+rp(M.gross)+'</b></div><div><small>Diskon & potongan</small><b>'+rp(M.discount+M.fee)+'</b></div><div><small>Pajak</small><b>'+rp(M.tax)+'</b></div></div>'+
 '<div class="v3-heading"><b>Tren 6 bulan</b><small>Pendapatan & laba</small></div><section class="chart-v3"><div class="report-chart">'+data.map((v,i)=>'<div><div class="bars-pair"><i style="height:'+Math.max(2,v.net/mx*100)+'%;background:var(--pr)"></i><i style="height:'+Math.max(2,Math.max(0,v.profit)/mx*100)+'%;background:var(--gr)"></i></div>'+MON[+months[i].slice(5)-1]+'</div>').join("")+'</div><div class="report-legend"><span><i class="legend-dot"></i>Pendapatan bersih</span><span><i class="legend-dot profit"></i>Laba bersih</span></div></section>'+
 '<div class="v3-heading"><b>Rincian laba rugi</b><small>'+MONF[mo-1]+' '+y+'</small></div><section class="statement-v3">'+row("Penjualan kotor",rp(M.gross))+row("Diskon penjualan","−"+rp(M.discount))+row("Penjualan setelah diskon",rp(M.revenue),"subtotal")+row("Potongan platform","−"+rp(M.fee))+row("Pendapatan setelah platform",rp(M.net),"subtotal")+row("Pajak dipotong dari penjualan","−"+rp(M.tax))+row("Uang diterima",rp(M.cash),"subtotal")+row("Bahan baku","−"+rp(M.by["Bahan baku"]||0))+row("Kemasan & perlengkapan","−"+rp(M.by["Kemasan & perlengkapan"]||0))+row("Laba kotor ("+pct+"%)",rp(gk),"subtotal")+other.map(c=>row(esc(c),"−"+rp(M.by[c]||0))).join("")+row("Laba bersih",rp(M.profit),"final")+'</section><p class="filter-note">Perhitungan mengikuti transaksi yang sudah tersimpan. Potongan platform dihitung terpisah dari belanja.</p>';
}
function shift(n){const [y,m]=rep.split("-").map(Number);const d=new Date(y,m-1+n,1);rep=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
function manage(){
 const theme=localStorage.getItem("lcm-theme")||"light",item=(ico,title,desc,action,label)=>'<div class="manage-row"><i>'+ico+'</i><span><b>'+title+'</b><small>'+desc+'</small></span><button class="btn sec" onclick="'+action+'">'+(label||"Kelola")+'</button></div>';
 const products=S.products.map(p=>'<div class="manage-row"><i>□</i><span><b>'+esc(p.name)+'</b><small>Jual '+rp(p.price)+' · HPP '+rp(p.cost)+'</small></span><button class="btn sec" onclick="editProd(\''+p.id+'\')">Edit</button></div>').join("");
 const plats=S.platforms.map(p=>'<div class="manage-row"><i>↗</i><span><b>'+esc(p.name)+'</b><small>Potongan '+p.fee+'%</small></span><button class="btn sec" onclick="editPlat(\''+p.id+'\')">Edit</button></div>').join("");
 const rec=S.rec.map(x=>'<div class="manage-row"><i>↻</i><span><b>'+esc(x.name)+'</b><small>'+rp(x.amount)+' · tiap tanggal '+x.day+'</small></span><button class="btn sec" onclick="editRec(\''+x.id+'\')">Edit</button></div>').join("");
 const staff=S.staff.map(x=>'<div class="manage-row"><i>○</i><span><b>'+esc(x.name)+'</b><small>'+rp(x.salary)+' · tiap tanggal '+x.day+'</small></span><button class="btn sec" onclick="editStaff(\''+x.id+'\')">Edit</button></div>').join("");
 const prices=S.prices.map(p=>{const l=p.h[p.h.length-1];return '<div class="manage-row"><i>≋</i><span><b>'+esc(p.name)+'</b><small>'+rp(l.price)+'/'+esc(p.unit)+' · '+l.date+'</small></span><button class="btn sec" onclick="editPrice(\''+p.id+'\')">Update</button></div>'}).join("");
 $("#app").innerHTML='<header class="page-head"><div><span class="page-kicker">PENGATURAN USAHA</span><h1 class="page-title">Kelola</h1><div class="page-subtitle">Data dan operasional bisnis.</div></div></header>'+

function editBusinessName(){const name=prompt("Nama usaha / pemilik",S.name);if(name!==null&&name.trim()){S.name=name.trim();save();render()}}

document.close=()=>shut();
function norm(){S.products=S.products||[];S.platforms=S.platforms||[];S.tx=S.tx||[];S.rec=S.rec||[];S.staff=S.staff||[];S.prices=S.prices||[];S.tax=S.tax||[];S.notes=S.notes||[];S.cats=S.cats||[];['Transportasi','Gaji karyawan'].forEach(c=>{if(!S.cats.includes(c))S.cats.push(c)})}
function allRec(){return[...S.rec,...S.staff.map(s=>({id:s.id,name:'Gaji '+s.name,amount:s.salary,cat:'Gaji karyawan',day:s.day,start:s.start,skip:s.skip}))]}
function applyRec(){
 norm();const now=today(),cm=now.slice(0,7),dn=+now.slice(8);let ch=false;
 allRec().forEach(r=>{
  let[y,m]=r.start.split('-').map(Number);
  for(;;){
   const k=y+'-'+String(m).padStart(2,'0');if(k>cm)break;
   const d=Math.min(r.day,28);
   if((k<cm||dn>=d)&&!(r.skip||[]).includes(k)&&!S.tx.some(t=>t.rid===r.id&&t.rm===k)){S.tx.push({id:uid(),type:'buy',date:k+'-'+String(d).padStart(2,'0'),cat:r.cat,amount:r.amount,note:r.name+' (otomatis)',rid:r.id,rm:k});ch=true}
   m++;if(m>12){m=1;y++}
  }
 });
 if(ch)save();
}

  return `<div class='li'><div>${esc(p.name)}<small>${rp(l.price)}/${esc(p.unit)} · ${l.date} ${v?(c>0?`<span class='neg'>naik ${c}%</span>`:c<0?`turun ${-c}%`:'tetap'):''}</small></div><button class='btn sec' data-i='${p.id}' onclick='editPrice(this.dataset.i)'>Update</button></div>`}).join('');

function saveNote(){
 const title=$("#noteTitle").value.trim(),body=$("#noteBody").value.trim(),date=$("#noteDate").value;
 if(!title)return alert("Isi judul catatan terlebih dahulu");
 if(!body)return alert("Isi catatan terlebih dahulu");
 if(!date)return alert("Pilih tanggal catatan");
 const now=new Date().toISOString();
 const data={title,body,category:$("#noteCategory").value,date,pinned:$("#notePinned").checked,updatedAt:now};
 if(NOTE.id){const old=S.notes.find(x=>x.id===NOTE.id);if(!old)return alert("Catatan tidak ditemukan");Object.assign(old,data)}
 else S.notes.push({id:uid(),...data,createdAt:now});
 save();shut();render();
}
function delNote(){

 if(confirm("Hapus catatan ini? Tindakan ini tidak bisa dibatalkan.")){
  S.notes=S.notes.filter(x=>x.id!==NOTE.id);save();shut();render();
 }
}

function saveTax(){
 const name=$("#taxName").value.trim(),period=$("#taxPeriod").value.trim(),amount=num($("#taxAmount").value),due=$("#taxDue").value;
 if(!name||!amount||!due)return alert("Isi nama pajak, nominal, dan tanggal jatuh tempo");
 const status=TX.status==="paid"?"paid":"unpaid";
 const paidDate=status==="paid"?($("#taxPaidDate")?$("#taxPaidDate").value:(TX.paidDate||today())):"";
 if(status==="paid"&&!paidDate)return alert("Isi tanggal pembayaran");
 const data={name,period,amount,due,status,paidDate,note:$("#taxNote").value.trim(),proof:$("#taxProof").value.trim()};
 if(TX.id)Object.assign(S.tax.find(x=>x.id===TX.id),data);else S.tax.push({id:uid(),...data});
 save();shut();render();
}
function delTax(){if(!TX.id)return;if(confirm("Hapus catatan kewajiban pajak ini?")){S.tax=S.tax.filter(x=>x.id!==TX.id);save();shut();render()}}

function moneyFromLine(line){
 // OCR kadang membaca huruf O sebagai angka 0 pada nominal.
 const normalized=String(line||"").replace(/[Oo]/g,"0");
 const marked=[...normalized.matchAll(/(?:rp\.?|idr)\s*([0-9][0-9.,\s]*[0-9]|[0-9])/gi)];
 const all=[...normalized.matchAll(/(?:^|[^\w])([0-9][0-9.,\s]{0,22}[0-9]|[0-9])(?=$|[^\w])/g)];
 const m=marked.length?marked[marked.length-1]:all[all.length-1];if(!m)return 0;
 // Rupiah memakai pemisah ribuan titik/koma; akhiran ,00 atau .00 adalah pecahan nol.
 const raw=m[1].replace(/\s+/g,"").replace(/[.,](\d{2})$/,"");
 const digits=raw.replace(/[^0-9]/g,"");return Number(digits)||0;
}
function parseCapture(text){
 const lines=text.split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
 const find=(re,exclude)=>{for(let i=lines.length-1;i>=0;i--)if(re.test(lines[i])&&!(exclude&&exclude.test(lines[i]))){
  const direct=moneyFromLine(lines[i]);if(direct)return direct;
  for(let j=i+1;j<Math.min(lines.length,i+3);j++){if(/^(tanggal|date|nama|rekening|dari rekening|jenis transfer|berita)/i.test(lines[j]))break;const next=moneyFromLine(lines[j]);if(next)return next}
 }return 0};
 let date=today();
 const dm=text.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/);
 if(dm){let y=Number(dm[3]);if(y<100)y+=2000;const d=String(Number(dm[1])).padStart(2,"0"),m=String(Number(dm[2])).padStart(2,"0");if(Number(m)<=12&&Number(d)<=31)date=y+"-"+m+"-"+d}
 else{
  const months={jan:"01",januari:"01",feb:"02",februari:"02",mar:"03",maret:"03",apr:"04",april:"04",mei:"05",may:"05",jun:"06",juni:"06",jul:"07",juli:"07",agu:"08",agt:"08",agustus:"08",sep:"09",sept:"09",september:"09",okt:"10",oktober:"10",nov:"11",november:"11",des:"12",desember:"12"};
  const dmText=text.match(/\b(\d{1,2})\s+(Jan(?:uari)?|Feb(?:ruari)?|Mar(?:et)?|Apr(?:il)?|Mei|May|Jun(?:i)?|Jul(?:i)?|Agu(?:stus)?|Agt|Sep(?:t(?:ember)?)?|Okt(?:ober)?|Nov(?:ember)?|Des(?:ember)?)\s+(\d{4})\b/i);
  if(dmText){const month=months[dmText[2].toLowerCase()];if(month)date=dmText[3]+"-"+month+"-"+String(Number(dmText[1])).padStart(2,"0")}
 }
 let gross=find(/(subtotal|sub total|total belanja|total penjualan|jumlah barang|gross)/i);
 const discount=find(/(diskon|discount|potongan harga|voucher)/i);
 const tax=find(/(ppn|pajak|tax)/i);
 const fee=find(/(biaya layanan|biaya admin|admin fee|service fee|platform fee|komisi)/i);
 // Abaikan "Total Item/Barang/Produk" agar angka kuantitas tidak dianggap nominal transaksi.
 const nonAmountTotal=/\btotal\s*(?:items?|barang|produk|qty|kuantitas)\b/i;
 let total=find(/(grand total|total bayar|total pembayaran|jumlah(?: bayar| pembayaran| transfer)?|amount(?: paid)?|total transfer|total akhir|total|nominal(?: transfer)?)/i,nonAmountTotal);
 if(!total)total=Math.max(0,gross-discount+tax+fee);
 if(!gross)gross=Math.max(0,total+discount-tax-fee);
 let merchant="";
 for(const line of lines.slice(0,7)){if(line.length>2&&!/(invoice|receipt|struk|tanggal|date|telp|phone|www\.)/i.test(line)){merchant=line.slice(0,90);break}}
 return{merchant,date,gross,discount,tax,fee,total};
}

 }finally{bitmap.close&&bitmap.close()}

(function(){
 const order=["home","list","rep","mgr"];
 let sx=0,sy=0,started=false;
 const app=document.getElementById("app");
 if(!app)return;
 app.addEventListener("touchstart",function(e){
  if(!e.touches||e.touches.length!==1||document.getElementById("sheet").classList.contains("show")){started=false;return}
  const t=e.touches[0];
  if(e.target.closest("input,textarea,select,[contenteditable='true']")){started=false;return}
  sx=t.clientX;sy=t.clientY;started=true;
 },{passive:true});
 app.addEventListener("touchend",function(e){
  if(!started||!e.changedTouches||!e.changedTouches.length)return;
  started=false;
  if(document.getElementById("sheet").classList.contains("show"))return;
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.25)return;
  const current=order.indexOf(tab);
  if(current<0)return;
  const next=current+(dx<0?1:-1);
  if(next<0||next>=order.length)return;
  tab=order[next];render();
 },{passive:true});
})();
