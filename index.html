<style>
:root{--bg:#f7f6f1;--card:#fffefa;--tx:#202923;--mu:#778078;--pr:#245b45;--pl:#e8efe8;--gr:#27845b;--rd:#c65b4b;--clay:#c7795c;--sage:#a8b9a5;--line:#e7e9e1;--sh:0 8px 28px rgba(35,55,42,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#151c18;--card:#202a23;--tx:#edf2ec;--mu:#a4b0a5;--pr:#a8c8ad;--pl:#2b3b30;--gr:#82c99b;--rd:#f08c7c;--clay:#d99173;--sage:#829b84;--line:#354239;--sh:0 8px 28px rgba(0,0,0,.18);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:520px;min-height:100dvh;padding:18px 17px calc(116px + env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1{font-size:25px;line-height:1.2;letter-spacing:-.8px;font-weight:800;margin:7px 0 16px}h2{font-size:16px;letter-spacing:-.25px;font-weight:750;margin:23px 0 11px}
small{font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);margin-bottom:13px}
.hero{background:linear-gradient(135deg,#285f49 0%,#194533 100%);color:#fff;border:0;border-radius:26px;padding:22px 20px;margin:12px 0 17px;box-shadow:0 12px 28px rgba(31,83,59,.18)}
.hero small{opacity:.78}.big{font-size:34px;letter-spacing:-1.3px;font-weight:800;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{border:1px solid var(--line);border-radius:19px;padding:14px;background:var(--card);color:var(--mu);font-size:12px}.stat b{display:block;color:var(--tx);font-size:18px;letter-spacing:-.5px;margin-top:7px}
.btn{border:0;border-radius:15px;padding:13px 17px;font-weight:700;font-size:13px;background:var(--pr);color:#fff;cursor:pointer;min-height:45px;box-shadow:0 4px 10px rgba(36,91,69,.12)}
.btn.sec{background:var(--pl);color:var(--pr);box-shadow:none}.btn.full{width:100%}.btn.del{background:transparent;color:var(--rd);padding:6px 10px;min-height:34px;box-shadow:none}
.eye{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:13px;width:38px;height:38px;font-size:17px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(133,166,137,.15)}
label{font-size:12px;font-weight:650;color:var(--mu);display:block;margin:13px 0 6px}
.seg{display:flex;background:var(--pl);border-radius:15px;padding:4px;margin-bottom:7px}
.seg button{flex:1;border:0;background:none;padding:10px 8px;border-radius:12px;font-weight:700;color:var(--mu);font-size:13px}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:0 2px 7px rgba(30,50,35,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:13px;padding:9px 12px;font-size:12px;font-weight:600}
.chip.on{border-color:var(--sage);background:var(--pl);color:var(--pr);font-weight:750}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(496px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:23px;box-shadow:0 8px 30px rgba(25,45,32,.14);display:flex;justify-content:space-around;align-items:center;padding:7px;z-index:8}
nav button{border:0;background:none;color:var(--mu);font:600 10px "Plus Jakarta Sans",sans-serif;padding:6px 10px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:53px}
nav button span{font-size:19px;line-height:1.3}nav button.on{background:var(--pl);color:var(--pr);font-weight:800}
nav .plus{background:var(--pr);color:#fff;width:49px;height:49px;min-width:49px;border-radius:17px;font-size:27px;justify-content:center;box-shadow:0 5px 12px rgba(36,91,69,.2)}
.sheet{position:fixed;inset:0;background:rgba(12,22,16,.48);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
.sheet.show{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border:1px solid var(--line);border-bottom:0;border-radius:27px 27px 0 0;padding:19px 18px calc(25px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 36px rgba(0,0,0,.12)}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}.li:last-child{border:0}
.li small{color:var(--mu);display:block;margin-top:2px}.pos{color:var(--gr)}.neg{color:var(--rd)}
.sum{font-weight:800}.empty{color:var(--mu);text-align:center;padding:20px 0}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu)}
.bars i{display:block;width:100%;border-radius:7px 7px 2px 2px;min-height:2px}
.pair{display:flex;gap:3px;align-items:flex-end;width:100%;height:calc(100% - 18px)}.pair i{flex:1}
hr{opacity:.3}
#cl{display:block;margin:0 0 9px auto;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:999px;padding:6px 12px;font:600 11px "Plus Jakarta Sans",sans-serif;cursor:pointer}
#lg{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}#lg.show{display:flex}#lg>div{width:100%;max-width:380px}#lg h2{margin:0 0 6px}#lg .e{color:var(--rd);font-size:13px;min-height:18px;margin:8px 0}


/* Shared page surfaces: history, reports and management */
#app>h1:not(.home-brand){font-size:25px;letter-spacing:-.9px;margin:7px 1px 18px}
#app>h2{display:flex;align-items:center;gap:8px;margin:23px 1px 10px;font-size:15px;letter-spacing:-.35px}
#app>.card{border-radius:20px;padding:15px 16px;box-shadow:var(--sh)}
#app>.card.row{min-height:54px}
#app>.card>.li{padding:13px 1px}
#app>.card>.li>div:first-child{min-width:0;font-size:12px;font-weight:650}
#app>.card>.li small{font-weight:500;font-size:10px;line-height:1.5}
#app>.card>.li>div:last-child{display:flex;align-items:center;gap:7px;flex-shrink:0}
#app>.grid{gap:10px}
#app .stat{border-radius:18px;padding:14px 13px;box-shadow:var(--sh);font-size:11px}
#app .stat b{font-size:16px;letter-spacing:-.45px}
#app .bars{height:142px;gap:8px}
#app .bars>div{font-size:10px}
#app .pair{gap:3px}
#app .btn{transition:transform .15s ease,filter .15s ease}
#app .btn:active,#app .home-action:active{transform:scale(.98)}
#app input,#app select{min-height:46px}
#app .chips{gap:7px}
#app .chip{border-radius:999px;padding:8px 12px}
#app .empty{padding:24px 12px;font-size:12px;line-height:1.6}
@media(max-width:360px){
 #app>.card{padding:13px}
 #app .stat{padding:12px 10px}
 #app .stat b{font-size:14px}
 #app>.card>.li>div:last-child{gap:3px}
}

/* Home dashboard redesign */
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:3px 1px 22px}
.home-greet{display:block;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.02em}
.home-brand{font-size:27px;line-height:1.12;letter-spacing:-1.1px;font-weight:800;margin:5px 0 0}
.home-month{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:750}
.home-hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#28634b 0%,#194633 72%,#143a2d 100%);color:#fff;border-radius:28px;padding:22px 20px 18px;margin:0 0 17px;box-shadow:0 16px 34px rgba(27,77,54,.18)}
.home-hero:before{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.09);border-radius:50%;right:-75px;top:-93px;box-shadow:0 0 0 22px rgba(255,255,255,.025),0 0 0 46px rgba(255,255,255,.02)}
.home-hero-top,.home-hero-main,.home-hero-bottom{position:relative;z-index:1}
.home-hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.home-eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.72)}
.home-month-name{font-size:13px;color:rgba(255,255,255,.9);font-weight:650;margin-top:3px}
.home-hero .eye{width:36px;height:36px;border-radius:12px}
.home-hero-main{padding:20px 0 17px}
.home-hero-label{font-size:12px;color:rgba(255,255,255,.74);font-weight:600}
.home-amount{font-size:clamp(30px,8vw,39px);line-height:1.15;letter-spacing:-1.5px;font-weight:800;margin:5px 0 7px;overflow-wrap:anywhere}
.home-hero-note{font-size:11px;color:rgba(255,255,255,.72)}
.home-hero-bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(255,255,255,.17);padding-top:15px}
.home-hero-metric{min-width:0}
.home-hero-metric span{display:block;font-size:10px;color:rgba(255,255,255,.68);margin-bottom:4px}
.home-hero-metric b{font-size:15px;letter-spacing:-.3px;overflow-wrap:anywhere}
.home-hero-metric+ .home-hero-metric{border-left:1px solid rgba(255,255,255,.17);padding-left:13px}
.home-section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 1px 11px}
.home-section-head h2{margin:0;font-size:16px;letter-spacing:-.4px}
.home-section-head small{color:var(--mu);font-size:10px;font-weight:650}
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.home-action{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:19px;padding:13px 12px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;box-shadow:var(--sh);cursor:pointer;font:inherit}
.home-action.primary{background:var(--pr);color:#fff;border-color:var(--pr)}
.home-action-icon{width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:13px;background:var(--pl);color:var(--pr);font-size:19px}
.home-action.primary .home-action-icon{background:rgba(255,255,255,.15);color:#fff}
.home-action strong{display:block;font-size:12px;font-weight:800;line-height:1.3}
.home-action small{display:block;color:var(--mu);font-size:10px;margin-top:3px}
.home-action.primary small{color:rgba(255,255,255,.72)}
.home-today-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.home-today-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;min-width:0}
.home-today-top{display:flex;align-items:center;gap:7px;color:var(--mu);font-size:10px;font-weight:650}
.home-today-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:9px;background:var(--pl);font-size:13px}
.home-today-card b{display:block;font-size:16px;letter-spacing:-.45px;margin-top:8px;overflow-wrap:anywhere}
.home-recent{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 14px;box-shadow:var(--sh)}
.home-recent .li{padding:12px 0}
.home-recent .li:first-child{border-top:0}
.home-recent-name{font-size:12px;font-weight:750;color:var(--tx)}
.home-recent-meta{font-size:10px;color:var(--mu);margin-top:3px}
.home-recent-amount{font-size:12px;font-weight:800;white-space:nowrap}
.home-see-all{border:0;background:none;color:var(--pr);font:750 11px "Plus Jakarta Sans",sans-serif;padding:8px 0;cursor:pointer}
.home-empty{padding:19px 8px;text-align:center;color:var(--mu);font-size:11px}
nav{padding:6px 7px;border-radius:24px;backdrop-filter:blur(18px);background:color-mix(in srgb,var(--card) 92%,transparent)}
nav button{min-width:55px;padding:7px 9px;font-size:10px}
nav button span{font-size:18px}
nav .plus{width:50px;height:50px;min-width:50px;border-radius:17px}
@media(max-width:360px){.home-brand{font-size:24px}.home-action{padding:11px 9px;gap:7px}.home-action-icon{width:34px;height:34px;flex-basis:34px}.home-today-card{padding:11px}.home-today-card b{font-size:14px}}

@media(min-width:540px){body{padding-top:24px}}

/* Laci Cuanmu · cohesive multi-screen UI */
:root{--bg:#f5f6f2;--card:#fff;--tx:#202a23;--mu:#7a857c;--pr:#245b45;--pl:#eaf1eb;--gr:#27845b;--rd:#c65b4b;--line:#e8ece6;--sh:0 5px 22px rgba(29,55,39,.055)}
:root[data-theme="dark"]{--bg:#121a15;--card:#1d2921;--tx:#edf3ed;--mu:#a2afa5;--pr:#a7c9ae;--pl:#2a3b30;--gr:#83c99a;--rd:#f08c7c;--line:#35453a;--sh:0 6px 24px rgba(0,0,0,.17)}
body{max-width:560px;padding:20px 18px calc(112px + env(safe-area-inset-bottom,0px));font-size:13px}
h1{font-size:26px;letter-spacing:-1px;margin:5px 0 5px}h2{font-size:15px;letter-spacing:-.35px;margin:22px 0 11px}
#app{min-height:65vh}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:4px 1px 20px}
.page-kicker{display:block;color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.page-title{margin:0;font-size:27px;line-height:1.15;letter-spacing:-1.05px;font-weight:800}
.page-subtitle{color:var(--mu);font-size:11px;margin-top:6px}
.page-pill{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;color:var(--mu);font-size:10px;font-weight:750}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 1px 10px}
.section-title h2{margin:0;font-size:15px}.section-title small{font-size:10px;color:var(--mu);font-weight:650}
.panel{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:15px;box-shadow:var(--sh);margin-bottom:12px}
.panel-flat{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:4px 14px;box-shadow:var(--sh);margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric-card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.metric-label{display:flex;align-items:center;gap:7px;color:var(--mu);font-size:10px;font-weight:700}
.metric-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:var(--pl);font-size:13px}
.metric-value{display:block;margin-top:9px;font-size:17px;line-height:1.25;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere}
.page-tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 1px 10px;scrollbar-width:none}
.page-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:999px;padding:9px 13px;font:700 11px inherit;cursor:pointer}
.page-tab.active{background:var(--pr);border-color:var(--pr);color:#fff}
.tx-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.tx-row:last-child{border-bottom:0}.tx-symbol{width:39px;height:39px;flex:0 0 39px;border-radius:14px;background:var(--pl);display:grid;place-items:center;color:var(--pr);font-size:17px;font-weight:800}
.tx-main{min-width:0;flex:1}.tx-title{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{font-size:10px;color:var(--mu);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-side{text-align:right;flex-shrink:0}.tx-amount{font-size:12px;font-weight:800;white-space:nowrap}
.tx-side .btn.del{font-size:10px;padding:3px 0;min-height:24px}
.report-hero{background:linear-gradient(145deg,#285f49,#173f2e);color:white;border-radius:24px;padding:19px;margin-bottom:12px;box-shadow:0 12px 28px rgba(31,83,59,.15)}
.report-hero .eyebrow{font-size:10px;color:rgba(255,255,255,.72);font-weight:700}.report-hero .value{font-size:29px;line-height:1.2;letter-spacing:-1px;font-weight:800;margin:6px 0}
.report-hero .hint{font-size:10px;color:rgba(255,255,255,.7)}.report-hero .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(255,255,255,.2);padding-top:13px;margin-top:15px}
.report-hero .mini span{display:block;font-size:9px;color:rgba(255,255,255,.68)}.report-hero .mini b{display:block;font-size:14px;margin-top:4px}
.report-chart{height:145px;display:flex;align-items:flex-end;gap:9px;padding-top:12px}
.report-chart>div{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;color:var(--mu);font-size:9px}
.report-chart .bars-pair{height:calc(100% - 18px);width:100%;display:flex;align-items:flex-end;gap:3px}.report-chart i{flex:1;min-height:2px;border-radius:6px 6px 2px 2px}
.report-legend{display:flex;gap:15px;color:var(--mu);font-size:10px;margin-top:12px}.report-legend span{display:flex;align-items:center;gap:5px}
.legend-dot{width:7px;height:7px;border-radius:50%;background:var(--pr)}.legend-dot.profit{background:var(--gr)}
.breakdown-row{display:flex;justify-content:space-between;gap:10px;padding:12px 1px;border-bottom:1px solid var(--line);font-size:11px}
.breakdown-row:last-child{border:0}.breakdown-row b{font-weight:750;white-space:nowrap}.breakdown-row.total{font-weight:800;font-size:12px}
.manage-group{margin:19px 0 9px 2px;font-size:11px;color:var(--mu);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.manage-item{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.manage-item:last-child{border-bottom:0}.manage-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:13px;background:var(--pl);font-size:17px}
.manage-copy{flex:1;min-width:0}.manage-copy b{display:block;font-size:12px}.manage-copy small{display:block;color:var(--mu);font-size:10px;margin-top:3px;line-height:1.4}
.manage-item .btn{padding:8px 11px;min-height:34px;font-size:10px}
.settings-theme{display:flex;gap:6px;background:var(--pl);padding:4px;border-radius:14px}
.settings-theme button{flex:1;border:0;background:transparent;color:var(--mu);border-radius:11px;padding:9px 5px;font-size:10px;font-weight:750}
.settings-theme button.on{background:var(--card);color:var(--pr);box-shadow:0 2px 7px rgba(30,50,35,.08)}
.empty-state{padding:27px 14px;text-align:center;color:var(--mu);font-size:11px;line-height:1.6}
.empty-state strong{display:block;color:var(--tx);font-size:12px;margin-bottom:4px}
.sheet>div{padding:20px 18px calc(26px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0}
.sheet label{margin:14px 0 6px}.sheet input,.sheet select{border-radius:13px}
nav{width:min(520px,calc(100% - 22px));padding:6px;border-radius:22px}
@media(max-width:360px){body{padding-left:14px;padding-right:14px}.page-title{font-size:24px}.metric-card{padding:12px}.metric-value{font-size:15px}.tx-symbol{width:35px;height:35px;flex-basis:35px}.report-hero .value{font-size:25px}nav button{min-width:49px;padding:6px}}


/* Transaction sheet refinement */
.sheet>div{background:var(--bg);box-shadow:0 -12px 45px rgba(25,45,32,.14)}
.sheet .row:first-child{align-items:center;margin-bottom:15px}
.sheet .row:first-child h2{font-size:19px;letter-spacing:-.5px}
.sheet .seg{display:flex;gap:5px;background:var(--pl);padding:5px;border-radius:17px}

<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script>
const KEY="catatan-usaha-v1";
const def={name:"Usaha Saya",hide:false,
 products:[{id:"p1",name:"Produk contoh A",price:15000,cost:7000},{id:"p2",name:"Produk contoh B",price:20000,cost:9000}],
 platforms:[{id:"f1",name:"Shopee Food",fee:20},{id:"f2",name:"GoFood",fee:20},{id:"f3",name:"GrabFood",fee:20},{id:"f4",name:"WhatsApp / langsung",fee:0}],
 cats:["Bahan baku","Kemasan & perlengkapan","Operasional"],tx:[]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def}catch(e){S=def}
norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudPush)window.cloudPush()};
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const mask=n=>S.hide?"Rp ••••••":rp(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let tab="home",rep=today().slice(0,7),listFilter="all";

function calc(list){
 let gross=0,fee=0,porsi=0,buy=0,by={};
 S.cats.forEach(c=>by[c]=0);
 list.forEach(t=>{
  if(t.type==="sale"){gross+=t.qty*t.price;fee+=t.fee;porsi+=t.qty}
  else{buy+=t.amount;by[t.cat]=(by[t.cat]||0)+t.amount}
 });
 const net=gross-fee;
 return{gross,fee,net,porsi,buy,by,profit:net-buy};
}
const inMonth=m=>S.tx.filter(t=>t.date.slice(0,7)===m);

function render(){
 applyRec();
 $("#nav").innerHTML=[["home","🏠","Beranda"],["list","🧾","Riwayat"],["add","＋",""],["rep","📊","Laporan"],["mgr","⚙️","Kelola"]]
 .map(([k,i,l])=>k==="add"?`<button class="plus" onclick="openAdd()">${i}</button>`:`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()"><span>${i}</span>${l}</button>`).join("");
 ({home,list,rep:report,mgr:manage})[tab]();window.scrollTo(0,0);
}
function home(){
 const m=today().slice(0,7),M=calc(inMonth(m)),T=calc(S.tx.filter(t=>t.date===today()));
 const mi=+m.slice(5)-1;
 const recent=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))).slice(0,3);
 const recentHtml=recent.length?recent.map(t=>{
  const sale=t.type==="sale",title=sale?(String(t.qty)+"× "+esc(t.name)):esc(t.cat);
  const meta=esc(t.date)+(sale?" · "+esc(t.platform):t.note?" · "+esc(t.note):"");
  const amount=sale?rp(t.qty*t.price-(t.fee||0)):rp(t.amount);
  return `<div class="li"><div style="min-width:0"><div class="home-recent-name">${sale?"↗ ":"↙ "}${title}</div><div class="home-recent-meta">${meta}</div></div><div class="home-recent-amount ${sale?"pos":"neg"}">${sale?"+":"−"}${amount}</div></div>`;
 }).join(""):`<div class="home-empty">Belum ada transaksi. Mulai catat penjualan atau belanja pertamamu.</div>`;
 $("#app").innerHTML=`
 <header class="home-head">
  <div><span class="home-greet">Halo, selamat datang di</span><h1 class="home-brand">${esc(S.name)}</h1></div>
  <span class="home-month">${MON[mi].toUpperCase()} ${m.slice(0,4)}</span>
 </header>
 <section class="home-hero">
  <div class="home-hero-top"><div><div class="home-eyebrow">Ringkasan bulanan</div><div class="home-month-name">${MONF[mi]} ${m.slice(0,4)}</div></div>
   <button class="eye" aria-label="Sembunyikan atau tampilkan nominal" onclick="S.hide=!S.hide;save();render()">${S.hide?"🙈":"👁"}</button>
  </div>
  <div class="home-hero-main"><div class="home-hero-label">Estimasi laba bersih</div><div class="home-amount">${mask(M.profit)}</div><div class="home-hero-note">${M.porsi?M.porsi+" porsi tercatat bulan ini":"Belum ada penjualan bulan ini"}</div></div>
  <div class="home-hero-bottom">
   <div class="home-hero-metric"><span>Pendapatan bersih</span><b>${mask(M.net)}</b></div>
   <div class="home-hero-metric"><span>Total belanja</span><b>${mask(M.buy)}</b></div>
  </div>
 </section>
 <div class="home-section-head"><h2>Aksi cepat</h2><small>Catat aktivitas usaha</small></div>
 <div class="home-actions">
  <button class="home-action primary" onclick="openAdd('sale')"><span class="home-action-icon">↗</span><span><strong>Catat penjualan</strong><small>Tambah pemasukan</small></span></button>
  <button class="home-action" onclick="openAdd('buy')"><span class="home-action-icon">↙</span><span><strong>Catat belanja</strong><small>Tambah pengeluaran</small></span></button>
 </div>
 <div class="home-section-head"><h2>Aktivitas hari ini</h2><small>${today().split("-").reverse().join("/")}</small></div>
 <div class="home-today-grid">
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">💰</span>Penjualan bersih</div><b>${mask(T.net)}</b></div>
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">🛒</span>Total belanja</div><b>${mask(T.buy)}</b></div>
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">📈</span>Laba hari ini</div><b>${mask(T.profit)}</b></div>
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">📦</span>Porsi terjual</div><b>${T.porsi} porsi</b></div>
 </div>
 <div class="home-section-head"><h2>Transaksi terbaru</h2><button class="home-see-all" onclick="tab='list';render()">Lihat semua →</button></div>
 <section class="home-recent">${recentHtml}</section>`;
}
function list(){
 const all=[...S.tx].sort((x,y)=>y.date.localeCompare(x.date)||String(y.id).localeCompare(String(x.id)));
 const a=listFilter==="all"?all:all.filter(t=>t.type===listFilter);
 const sales=all.filter(t=>t.type==="sale").reduce((n,t)=>n+t.qty*t.price,0);
 const buys=all.filter(t=>t.type==="buy").reduce((n,t)=>n+t.amount,0);

function norm(){S.products=S.products||[];S.platforms=S.platforms||[];S.tx=S.tx||[];S.rec=S.rec||[];S.staff=S.staff||[];S.prices=S.prices||[];S.cats=S.cats||[];['Transportasi','Gaji karyawan'].forEach(c=>{if(!S.cats.includes(c))S.cats.push(c)})}
function allRec(){return[...S.rec,...S.staff.map(s=>({id:s.id,name:'Gaji '+s.name,amount:s.salary,cat:'Gaji karyawan',day:s.day,start:s.start,skip:s.skip}))]}
function applyRec(){
 norm();const now=today(),cm=now.slice(0,7),dn=+now.slice(8);let ch=false;
 allRec().forEach(r=>{
  let[y,m]=r.start.split('-').map(Number);
  for(;;){
   const k=y+'-'+String(m).padStart(2,'0');if(k>cm)break;
   const d=Math.min(r.day,28);
   if((k<cm||dn>=d)&&!(r.skip||[]).includes(k)&&!S.tx.some(t=>t.rid===r.id&&t.rm===k)){S.tx.push({id:uid(),type:'buy',date:k+'-'+String(d).padStart(2,'0'),cat:r.cat,amount:r.amount,note:r.name+' (otomatis)',rid:r.id,rm:k});ch=true}
   m++;if(m>12){m=1;y++}
  }
 });
 if(ch)save();
}

function open(h){$("#sheetBody").innerHTML=h;$("#sheet").classList.add("show")}
function close(){$("#sheet").classList.remove("show")}
$("#sheet").onclick=e=>{if(e.target.id==="sheet")close()};
const num=v=>Math.max(0,parseFloat(String(v).replace(/[^\d.]/g,""))||0);

function editProd(id){
 const p=S.products.find(x=>x.id===id)||{name:"",price:"",cost:""};
 open(`<div class="row"><h2 style="margin:0">${id?"Edit":"Tambah"} produk</h2><button class="btn sec" onclick="close()">✕</button></div>
 <label>Nama produk</label><input id="pn" value="${esc(p.name)}"><label>Harga jual (Rp)</label><input id="pp" type="number" inputmode="numeric" value="${p.price}">
 <label>Modal per porsi / HPP (Rp)</label><input id="pc" type="number" inputmode="numeric" value="${p.cost}">
 <button class="btn full" style="margin-top:16px" onclick="saveProd('${id||""}')">Simpan</button>
 ${id?`<button class="btn del full" onclick="if(confirm('Hapus produk?')){S.products=S.products.filter(x=>x.id!=='${id}');save();close();render()}">Hapus produk</button>`:""}`);
}
function saveProd(id){
 const name=$("#pn").value.trim();if(!name)return alert("Isi nama produk");
 const o={name,price:num($("#pp").value),cost:num($("#pc").value)};
 if(id)Object.assign(S.products.find(x=>x.id===id),o);else S.products.push({id:uid(),...o});
 save();close();render();
}
function editPlat(id){
 const p=S.platforms.find(x=>x.id===id)||{name:"",fee:0};
 open(`<div class="row"><h2 style="margin:0">${id?"Edit":"Tambah"} platform</h2><button class="btn sec" onclick="close()">✕</button></div>
 <label>Nama platform</label><input id="fn" value="${esc(p.name)}"><label>Potongan (%)</label><input id="ff" type="number" inputmode="decimal" value="${p.fee}">
 <button class="btn full" style="margin-top:16px" onclick="savePlat('${id||""}')">Simpan</button>
 ${id?`<button class="btn del full" onclick="if(confirm('Hapus platform?')){S.platforms=S.platforms.filter(x=>x.id!=='${id}');save();close();render()}">Hapus platform</button>`:""}`);
}
function savePlat(id){
 const name=$("#fn").value.trim();if(!name)return alert("Isi nama platform");
 const o={name,fee:Math.min(100,num($("#ff").value))};
 if(id)Object.assign(S.platforms.find(x=>x.id===id),o);else S.platforms.push({id:uid(),...o});
 save();close();render();
}

let F={};
function openAdd(type){F={type:type||"sale",pid:S.products[0]?.id,plat:S.platforms[0]?.id,cat:S.cats[0],qty:1,date:today()};drawAdd()}
function drawAdd(){
 const sale=F.type==="sale";
 let body;
 if(sale){
  const p=S.products.find(x=>x.id===F.pid),pl=S.platforms.find(x=>x.id===F.plat);
  const price=F.price!=null?F.price:(p?p.price:0);
  body=S.products.length?`<label>Produk</label><div class="chips">${S.products.map(x=>`<button class="chip ${x.id===F.pid?"on":""}" onclick="F.pid='${x.id}';F.price=null;drawAdd()">${esc(x.name)}</button>`).join("")}</div>
  <label>Jumlah porsi</label><div class="row"><button class="btn sec" onclick="F.qty=Math.max(1,F.qty-1);drawAdd()">−</button><b style="font-size:22px">${F.qty}</b><button class="btn sec" onclick="F.qty++;drawAdd()">＋</button></div>
  <label>Harga jual per porsi (bisa diubah)</label><input type="number" inputmode="numeric" value="${price}" oninput="F.price=num(this.value);upd()">
  <label>Platform</label><div class="chips">${S.platforms.map(x=>`<button class="chip ${x.id===F.plat?"on":""}" onclick="F.plat='${x.id}';drawAdd()">${esc(x.name)} · ${x.fee}%</button>`).join("")}</div>
  <div class="card" style="margin-top:14px" id="prev"></div>`
  :`<div class="empty">Tambahkan produk dulu di menu Kelola.</div>`;
 }else{
  body=`<label>Nominal (Rp)</label><input id="am" type="number" inputmode="numeric" placeholder="0" value="${F.amount||""}" oninput="F.amount=num(this.value)">
  <label>Kategori</label><div class="chips">${S.cats.map(c=>`<button class="chip ${c===F.cat?"on":""}" onclick="F.cat='${esc(c)}';drawAdd()">${esc(c)}</button>`).join("")}</div>
  <label>Catatan (opsional)</label><input value="${esc(F.note||"")}" oninput="F.note=this.value">`;
 }
 open(`<div class="row"><h2 style="margin:0">Catat transaksi</h2><button class="btn sec" onclick="close()">✕</button></div>
 <div class="seg" style="margin-top:12px"><button class="${sale?"on":""}" onclick="F.type='sale';drawAdd()">Penjualan</button><button class="${!sale?"on":""}" onclick="F.type='buy';drawAdd()">Belanja</button></div>
 ${body}<label>Tanggal</label><input type="date" value="${F.date}" onchange="F.date=this.value">
 <button class="btn full" style="margin-top:18px" onclick="saveTx()">Simpan</button>`);
 if(sale)upd();
}
function upd(){
 const e=$("#prev");if(!e)return;
 const p=S.products.find(x=>x.id===F.pid),pl=S.platforms.find(x=>x.id===F.plat);if(!p||!pl)return;
 const price=F.price!=null?F.price:p.price,g=price*F.qty,fee=g*pl.fee/100;
 e.innerHTML=`<div class="li"><span>Penjualan kotor</span><span>${rp(g)}</span></div><div class="li"><span>Potongan ${pl.fee}%</span><span>−${rp(fee)}</span></div><div class="li sum"><span>Diterima</span><span>${rp(g-fee)}</span></div><div class="li"><span>Laba kotor (setelah modal)</span><span class="pos">${rp(g-fee-p.cost*F.qty)}</span></div>`;
}
function saveTx(){
 if(!F.date)return alert("Pilih tanggal");
 if(F.type==="sale"){
  const p=S.products.find(x=>x.id===F.pid),pl=S.platforms.find(x=>x.id===F.plat);
  if(!p||!pl)return alert("Lengkapi produk dan platform dulu");
  const price=F.price!=null?F.price:p.price;
  S.tx.push({id:uid(),type:"sale",date:F.date,name:p.name,qty:F.qty,price,cost:p.cost,platform:pl.name,fee:Math.round(price*F.qty*pl.fee/100)});
 }else{
  if(!F.amount)return alert("Isi nominal belanja");
  S.tx.push({id:uid(),type:"buy",date:F.date,cat:F.cat,amount:F.amount,note:F.note||""});
 }
 save();close();render();
}
