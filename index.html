<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laci Cuanmu</title>
<meta name="theme-color" content="#245b45">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
 --bg:#f4f5f0;--card:#fff;--tx:#202a23;--mu:#7c877e;--pr:#245b45;
 --pl:#e9f0e9;--gr:#27845b;--rd:#b96a60;--line:#e5e9e3;
 --sh:0 8px 28px rgba(29,55,39,.055);--sh2:0 3px 12px rgba(29,55,39,.045);
 color-scheme:light
}
:root[data-theme="dark"]{
 --bg:#121a15;--card:#1d2921;--tx:#edf3ed;--mu:#a2afa5;--pr:#a7c9ae;
 --pl:#2a3b30;--gr:#83c99a;--rd:#f08c7c;--line:#35453a;
 --sh:0 8px 28px rgba(0,0,0,.18);--sh2:0 3px 12px rgba(0,0,0,.13);color-scheme:dark
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:18px}
body{margin:0 auto;max-width:560px;min-height:100dvh;padding:22px 18px calc(126px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--tx);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--pr) 24%,transparent);outline-offset:2px}
h1{margin:0;font-size:34px;line-height:1.13;font-weight:800;letter-spacing:-1.35px}
h2{margin:0;font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.6px}
small{font-size:13px}
#app{min-height:70vh}
.card,.panel,.metric-card,.home-recent{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.card,.panel{border-radius:24px;padding:19px;margin-bottom:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid,.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{min-width:0;padding:17px;border:1px solid var(--line);border-radius:21px;background:var(--card);color:var(--mu);font-size:13px;box-shadow:var(--sh2)}
.stat b{display:block;margin-top:8px;color:var(--tx);font-size:22px;line-height:1.25;letter-spacing:-.65px;overflow-wrap:anywhere}
.btn{min-height:48px;padding:12px 17px;border:0;border-radius:16px;background:var(--pr);color:#fff;font-size:14px;font-weight:750;box-shadow:0 5px 13px rgba(36,91,69,.13);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.97)}
.btn.sec{background:var(--pl);color:var(--pr);box-shadow:none}
.btn.full{width:100%}.btn.del{min-height:32px;padding:5px 9px;background:transparent;color:var(--rd);box-shadow:none;font-size:12px}
input,select{width:100%;min-height:54px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--pl)}
label{display:block;margin:17px 0 8px;color:var(--mu);font-size:14px;font-weight:750}
.seg{display:flex;gap:5px;padding:5px;border-radius:18px;background:var(--pl)}
.seg button{flex:1;min-height:48px;padding:10px;border:0;border-radius:14px;background:transparent;color:var(--mu);font-size:15px;font-weight:750}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:var(--sh2)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{min-height:44px;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--tx);font-size:14px;font-weight:700}
.chip.on{border-color:#afc2b2;background:var(--pl);color:var(--pr)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li small{display:block;margin-top:4px;color:var(--mu);font-size:13px}
.pos{color:var(--gr)}.neg{color:var(--rd)}.sum{font-weight:800}
.empty{padding:26px 12px;color:var(--mu);text-align:center;font-size:14px}
.empty-state{padding:28px 15px;color:var(--mu);text-align:center;font-size:14px;line-height:1.6}
.empty-state strong{display:block;margin-bottom:5px;color:var(--tx);font-size:16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:5px 1px 24px}
.page-kicker{display:block;margin-bottom:7px;color:var(--mu);font-size:13px;font-weight:800;letter-spacing:.075em}
.page-title{font-size:36px;letter-spacing:-1.5px}
.page-subtitle{margin-top:8px;color:var(--mu);font-size:15px;line-height:1.5}
.page-pill{flex-shrink:0;margin-top:0;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mu);font-size:13px;font-weight:750}
.section-title,.home-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:27px 2px 14px}
.section-title h2,.home-section-head h2{font-size:21px}
.section-title small,.home-section-head small{color:var(--mu);font-size:13px;font-weight:700}
.metric-card{min-width:0;padding:17px;border-radius:22px;box-shadow:var(--sh2)}
.metric-label{display:flex;align-items:center;gap:9px;color:var(--mu);font-size:13px;font-weight:750;line-height:1.35}
.metric-icon{display:grid;width:36px;height:36px;flex:0 0 36px;place-items:center;border-radius:13px;background:var(--pl);font-size:17px}
.metric-value{display:block;margin-top:11px;font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.7px;overflow-wrap:anywhere}
.page-tabs{display:flex;gap:9px;overflow-x:auto;padding:3px 1px 14px;scrollbar-width:none}
.page-tabs::-webkit-scrollbar{display:none}
.page-tab{flex:0 0 auto;min-height:46px;padding:11px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mu);font-family:inherit;font-size:15px;font-weight:700}
.page-tab.active{border-color:var(--pr);background:var(--pr);color:white}
.panel-flat{padding:5px 19px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--sh)}
.tx-row{display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid var(--line)}
.tx-row:last-child{border-bottom:0}
.tx-symbol{display:grid;width:48px;height:48px;flex:0 0 48px;place-items:center;border-radius:17px;background:var(--pl);color:var(--pr);font-size:21px;font-weight:800}
.tx-main{min-width:0;flex:1}
.tx-title{overflow:hidden;color:var(--tx);font-size:16px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{overflow:hidden;margin-top:5px;color:var(--mu);font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.tx-side{flex-shrink:0;text-align:right}.tx-amount{font-size:16px;font-weight:800;white-space:nowrap}
.tx-side .btn.del{display:block;margin:4px 0 0 auto;min-height:27px;padding:3px 8px;border:1px solid var(--line);border-radius:9px;color:var(--mu);font-size:11px}
.report-hero,.hero{margin:0 0 15px;padding:25px 22px;border:0;border-radius:28px;background:linear-gradient(145deg,#28634b 0%,#194633 72%,#143a2d 100%);color:#fff;box-shadow:0 15px 34px rgba(27,77,54,.17)}
.report-hero .eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;color:rgba(255,255,255,.75)}
.report-hero .value,.big{margin:8px 0;font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-1.8px;overflow-wrap:anywhere}
.report-hero .hint{color:rgba(255,255,255,.75);font-size:14px}
.report-hero .mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;padding-top:17px;border-top:1px solid rgba(255,255,255,.2)}
.report-hero .mini span{display:block;color:rgba(255,255,255,.7);font-size:13px}
.report-hero .mini b{display:block;margin-top:5px;font-size:20px}
.bars{display:flex;height:175px;align-items:flex-end;gap:10px;padding-top:12px}
.bars>div{display:flex;height:100%;flex:1;flex-direction:column;align-items:center;justify-content:flex-end;color:var(--mu);font-size:12px}
.pair{display:flex;width:100%;height:calc(100% - 20px);align-items:flex-end;gap:3px}.pair i{flex:1}
.report-chart{display:flex;height:175px;align-items:flex-end;gap:10px;padding-top:12px}
.report-chart>div{display:flex;height:100%;flex:1;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;color:var(--mu);font-size:12px}
.report-chart .bars-pair{display:flex;width:100%;height:calc(100% - 20px);align-items:flex-end;gap:3px}
.report-chart i{min-height:2px;flex:1;border-radius:7px 7px 2px 2px}
.report-legend{display:flex;flex-wrap:wrap;gap:17px;margin-top:15px;color:var(--mu);font-size:13px}
.report-legend span{display:flex;align-items:center;gap:6px}.legend-dot{width:9px;height:9px;border-radius:50%;background:var(--pr)}.legend-dot.profit{background:var(--gr)}
.breakdown-row{display:flex;justify-content:space-between;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);font-size:14px}
.breakdown-row:last-child{border:0}.breakdown-row b{font-weight:750;white-space:nowrap}.breakdown-row.total{font-size:16px;font-weight:800}
.manage-group{margin:27px 2px 12px;color:var(--mu);font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.manage-item{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.manage-item:last-child{border-bottom:0}
.manage-icon{display:grid;width:49px;height:49px;flex:0 0 49px;place-items:center;border-radius:17px;background:var(--pl);font-size:22px}
.manage-copy{min-width:0;flex:1}.manage-copy b{display:block;font-size:16px;line-height:1.4}.manage-copy small{display:block;margin-top:4px;color:var(--mu);font-size:14px;line-height:1.45}
.manage-item .btn{min-height:43px;padding:9px 15px;border-radius:14px;font-size:13px}
.settings-theme{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--pl)}
.settings-theme button{flex:1;padding:11px 7px;border:0;border-radius:12px;background:transparent;color:var(--mu);font-size:13px;font-weight:750}
.settings-theme button.on{background:var(--card);color:var(--pr);box-shadow:var(--sh2)}
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 1px 25px}
.home-greet{display:block;color:var(--mu);font-size:16px;font-weight:600}
.home-brand{margin:5px 0 0;font-size:39px;line-height:1.1;letter-spacing:-1.8px}
.home-month{flex-shrink:0;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mu);font-size:13px;font-weight:800}
.home-hero{position:relative;overflow:hidden;margin-bottom:20px;padding:27px 24px 23px;border-radius:31px;background:linear-gradient(145deg,#28634b 0%,#194633 72%,#143a2d 100%);color:white;box-shadow:0 17px 36px rgba(27,77,54,.18)}
.home-hero:before{position:absolute;top:-95px;right:-77px;width:210px;height:210px;border:1px solid rgba(255,255,255,.1);border-radius:50%;content:"";box-shadow:0 0 0 24px rgba(255,255,255,.025),0 0 0 50px rgba(255,255,255,.02)}
.home-hero-top,.home-hero-main,.home-hero-bottom{position:relative;z-index:1}
.home-hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.home-eyebrow{color:rgba(255,255,255,.72);font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.home-month-name{margin-top:5px;color:rgba(255,255,255,.92);font-size:17px;font-weight:700}
.home-hero .eye{width:48px;height:48px;border:1px solid rgba(255,255,255,.22);border-radius:16px;background:rgba(255,255,255,.15);color:white;font-size:21px}
.home-hero-main{padding:25px 0 20px}.home-hero-label{color:rgba(255,255,255,.76);font-size:17px;font-weight:650}
.home-amount{margin:7px 0;font-size:clamp(37px,9vw,46px);line-height:1.12;font-weight:800;letter-spacing:-2px;overflow-wrap:anywhere}
.home-hero-note{color:rgba(255,255,255,.73);font-size:15px}
.home-hero-bottom{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding-top:19px;border-top:1px solid rgba(255,255,255,.2)}
.home-hero-metric span{display:block;margin-bottom:5px;color:rgba(255,255,255,.7);font-size:14px}
.home-hero-metric b{font-size:22px;letter-spacing:-.5px;overflow-wrap:anywhere}
.home-hero-metric+.home-hero-metric{padding-left:15px;border-left:1px solid rgba(255,255,255,.2)}
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.home-action{display:flex;min-width:0;min-height:118px;align-items:center;gap:13px;padding:18px 16px;border:1px solid var(--line);border-radius:23px;background:var(--card);color:var(--tx);box-shadow:var(--sh);text-align:left}
.home-action.primary{border-color:var(--pr);background:var(--pr);color:white}
.home-action-icon{display:grid;width:51px;height:51px;flex:0 0 51px;place-items:center;border-radius:18px;background:var(--pl);color:var(--pr);font-size:24px}
.home-action.primary .home-action-icon{background:rgba(255,255,255,.16);color:white}
.home-action strong{display:block;font-size:16px;font-weight:800;line-height:1.3}.home-action small{display:block;margin-top:5px;color:var(--mu);font-size:14px;line-height:1.4}
.home-action.primary small{color:rgba(255,255,255,.72)}
.home-today-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-today-card{min-width:0;padding:17px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--sh2)}
.home-today-top{display:flex;align-items:center;gap:9px;color:var(--mu);font-size:14px;font-weight:750}
.home-today-icon{display:grid;width:36px;height:36px;place-items:center;border-radius:13px;background:var(--pl);font-size:18px}
.home-today-card b{display:block;margin-top:11px;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.7px;overflow-wrap:anywhere}
.home-recent{padding:5px 19px;border-radius:23px}
.home-recent .li{padding:16px 0}
.home-recent-name{font-size:15px;font-weight:800}.home-recent-meta{margin-top:4px;color:var(--mu);font-size:13px}
.home-recent-amount{font-size:15px;font-weight:800;white-space:nowrap}
.home-see-all{padding:8px 0;border:0;background:transparent;color:var(--pr);font-size:14px;font-weight:800}
.home-empty{padding:22px 8px;color:var(--mu);text-align:center;font-size:14px}
nav{position:fixed;z-index:8;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;display:flex;width:min(540px,calc(100% - 22px));align-items:center;justify-content:space-around;margin:auto;padding:9px;border:1px solid var(--line);border-radius:29px;background:color-mix(in srgb,var(--card) 93%,transparent);box-shadow:0 10px 34px rgba(25,45,32,.15);backdrop-filter:blur(18px)}
nav button{display:flex;min-width:62px;flex-direction:column;align-items:center;gap:3px;padding:8px 9px;border:0;border-radius:17px;background:transparent;color:var(--mu);font-size:13px;font-weight:700}
nav button span{font-size:23px;line-height:1.25}nav button.on{background:var(--pl);color:var(--pr);font-weight:800}
nav .plus{display:grid;width:60px;height:60px;min-width:60px;place-items:center;border-radius:20px;background:var(--pr);color:#fff;font-size:34px;box-shadow:0 6px 15px rgba(36,91,69,.2)}
.sheet{position:fixed;z-index:9;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(12,22,16,.48);backdrop-filter:blur(5px)}
.sheet.show{display:flex}
.sheet>div{width:100%;max-width:560px;max-height:94dvh;overflow:auto;padding:23px 21px calc(30px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-bottom:0;border-radius:31px 31px 0 0;background:var(--bg);box-shadow:0 -12px 42px rgba(0,0,0,.13)}
.sheet .row:first-child{margin-bottom:17px}.sheet .row:first-child h2{font-size:24px;letter-spacing:-.7px}
.sheet label{margin:19px 0 9px;font-size:14px}.sheet input,.sheet select{min-height:57px;font-size:16px}
.sheet .seg{margin:14px 0 19px}.sheet .chips{gap:9px}.sheet .chip{min-height:46px;padding:11px 15px;font-size:14px}
.sheet #prev{margin-top:19px;padding:17px 18px;border-radius:23px;background:var(--card)}
.sheet #prev .li{padding:15px 0;font-size:15px}.sheet #prev .li.sum{font-size:16px}
.sheet .btn.full{min-height:56px;margin-top:22px;border-radius:17px;font-size:16px}
#cl{display:block;margin:0 0 10px auto;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mu);font-size:12px;font-weight:750}
#lg{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg)}#lg.show{display:flex}#lg>div{width:100%;max-width:390px}#lg h2{margin:0 0 7px}#lg .e{min-height:20px;margin:8px 0;color:var(--rd);font-size:13px}
.filter-note{color:var(--mu);font-size:13px;line-height:1.6}
@media(max-width:390px){
 body{padding:18px 15px calc(121px + env(safe-area-inset-bottom,0px))}
 .page-title{font-size:32px}.page-subtitle{font-size:14px}
 .metric-card{padding:14px}.metric-value{font-size:20px}
 .tx-row{gap:10px}.tx-symbol{width:42px;height:42px;flex-basis:42px}.tx-title{font-size:14px}.tx-meta{font-size:12px}.tx-amount{font-size:14px}
 .home-brand{font-size:34px}.home-amount{font-size:37px}
 .home-action{min-height:106px;padding:13px 10px;gap:8px}.home-action-icon{width:42px;height:42px;flex-basis:42px}
 .home-action strong{font-size:14px}.home-action small{font-size:12px}
 .home-today-card{padding:13px}.home-today-card b{font-size:20px}
 .manage-icon{width:43px;height:43px;flex-basis:43px}.manage-copy b{font-size:14px}.manage-copy small{font-size:12px}
 nav button{min-width:51px;padding:7px 5px;font-size:11px}nav button span{font-size:20px}
 nav .plus{width:54px;height:54px;min-width:54px}
 .sheet>div{padding-right:16px;padding-left:16px}
}
@media(min-width:540px){body{padding-top:26px}}

 .page-title{font-size:27px}
 .home-brand{font-size:29px}
 .home-amount{font-size:32px}
 .home-action{min-height:94px;padding:12px 9px}
 .home-action strong{font-size:13px}
 .home-action small{font-size:11px}
 .home-today-card b{font-size:18px}
 .metric-value{font-size:18px}
 .manage-copy b{font-size:13px}
 .manage-copy small{font-size:11px}
}

</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script>
const KEY="catatan-usaha-v1";
const def={name:"Usaha Saya",hide:false,
 products:[{id:"p1",name:"Produk contoh A",price:15000,cost:7000},{id:"p2",name:"Produk contoh B",price:20000,cost:9000}],
 platforms:[{id:"f1",name:"Shopee Food",fee:20},{id:"f2",name:"GoFood",fee:20},{id:"f3",name:"GrabFood",fee:20},{id:"f4",name:"WhatsApp / langsung",fee:0}],
 cats:["Bahan baku","Kemasan & perlengkapan","Operasional"],tx:[]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def}catch(e){S=def}
norm();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudPush)window.cloudPush()};
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const mask=n=>S.hide?"Rp ••••••":rp(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let tab="home",rep=today().slice(0,7),listFilter="all";

function calc(list){
 let gross=0,fee=0,tax=0,porsi=0,buy=0,by={};
 S.cats.forEach(c=>by[c]=0);
 list.forEach(t=>{
  if(t.type==="sale"){gross+=t.qty*t.price;fee+=t.fee||0;tax+=t.tax||0;porsi+=t.qty}
  else{buy+=t.amount;by[t.cat]=(by[t.cat]||0)+t.amount}
 });
 const net=gross-fee,cash=net-tax;
 return{gross,fee,tax,net,cash,porsi,buy,by,profit:net-buy};
}
const inMonth=m=>S.tx.filter(t=>t.date.slice(0,7)===m);

function render(){
 applyRec();
 $("#nav").innerHTML=[["home","🏠","Beranda"],["list","🧾","Riwayat"],["add","＋",""],["rep","📊","Laporan"],["mgr","⚙️","Kelola"]]
 .map(([k,i,l])=>k==="add"?`<button class="plus" onclick="openAdd()">${i}</button>`:`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()"><span>${i}</span>${l}</button>`).join("");
 ({home,list,rep:report,mgr:manage})[tab]();window.scrollTo(0,0);
}
function home(){
 const m=today().slice(0,7),M=calc(inMonth(m)),T=calc(S.tx.filter(t=>t.date===today()));
 const mi=+m.slice(5)-1;
 const recent=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))).slice(0,3);
 const recentHtml=recent.length?recent.map(t=>{
  const sale=t.type==="sale",title=sale?(String(t.qty)+"× "+esc(t.name)):esc(t.cat);
  const meta=esc(t.date)+(sale?" · "+esc(t.platform):t.note?" · "+esc(t.note):"");
  const amount=sale?rp(t.qty*t.price-(t.fee||0)-(t.tax||0)):rp(t.amount);
  return `<div class="li"><div style="min-width:0"><div class="home-recent-name">${sale?"↗ ":"↙ "}${title}</div><div class="home-recent-meta">${meta}</div></div><div class="home-recent-amount ${sale?"pos":"neg"}">${sale?"+":"−"}${amount}</div></div>`;
 }).join(""):`<div class="home-empty">Belum ada transaksi. Mulai catat penjualan atau belanja pertamamu.</div>`;
 $("#app").innerHTML=`
 <header class="home-head">
  <div><span class="home-greet">Halo, selamat datang di</span><h1 class="home-brand">${esc(S.name)}</h1></div>
  <span class="home-month">${MON[mi].toUpperCase()} ${m.slice(0,4)}</span>
 </header>
 <section class="home-hero">
  <div class="home-hero-top"><div><div class="home-eyebrow">Ringkasan bulanan</div><div class="home-month-name">${MONF[mi]} ${m.slice(0,4)}</div></div>
   <button class="eye" aria-label="Sembunyikan atau tampilkan nominal" onclick="S.hide=!S.hide;save();render()">${S.hide?"🙈":"👁"}</button>
  </div>
  <div class="home-hero-main"><div class="home-hero-label">Estimasi laba bersih</div><div class="home-amount">${mask(M.profit)}</div><div class="home-hero-note">${M.porsi?M.porsi+" porsi tercatat bulan ini":"Belum ada penjualan bulan ini"}</div></div>
  <div class="home-hero-bottom">
   <div class="home-hero-metric"><span>Pendapatan bersih</span><b>${mask(M.net)}</b></div>
   <div class="home-hero-metric"><span>Total belanja</span><b>${mask(M.buy)}</b></div>
  </div>
 </section>
 <div class="home-section-head"><h2>Aksi cepat</h2><small>Catat aktivitas usaha</small></div>
 <div class="home-actions">
  <button class="home-action primary" onclick="openAdd('sale')"><span class="home-action-icon">↗</span><span><strong>Catat penjualan</strong><small>Tambah pemasukan</small></span></button>
  <button class="home-action" onclick="openAdd('buy')"><span class="home-action-icon">↙</span><span><strong>Catat belanja</strong><small>Tambah pengeluaran</small></span></button>
 </div>
 <div class="home-section-head"><h2>Aktivitas hari ini</h2><small>${today().split("-").reverse().join("/")}</small></div>
 <div class="home-today-grid">
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">💰</span>Penjualan bersih</div><b>${mask(T.net)}</b></div>
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">🛒</span>Total belanja</div><b>${mask(T.buy)}</b></div>
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">📈</span>Laba hari ini</div><b>${mask(T.profit)}</b></div>
  <div class="home-today-card"><div class="home-today-top"><span class="home-today-icon">📦</span>Porsi terjual</div><b>${T.porsi} porsi</b></div>
 </div>
 <div class="home-section-head"><h2>Transaksi terbaru</h2><button class="home-see-all" onclick="tab='list';render()">Lihat semua →</button></div>
 <section class="home-recent">${recentHtml}</section>`;
}
function list(){
 const all=[...S.tx].sort((x,y)=>y.date.localeCompare(x.date)||String(y.id).localeCompare(String(x.id)));
 const a=listFilter==="all"?all:all.filter(t=>t.type===listFilter);
 const sales=all.filter(t=>t.type==="sale").reduce((n,t)=>n+t.qty*t.price,0);
 const buys=all.filter(t=>t.type==="buy").reduce((n,t)=>n+t.amount,0);
 const tabs=[["all","Semua"],["sale","Penjualan"],["buy","Belanja"]].map(x=>'<button class="page-tab '+(listFilter===x[0]?"active":"")+'" onclick="listFilter=\''+x[0]+'\';render()">'+x[1]+'</button>').join("");
 const rows=a.length?a.map(t=>{
  const sale=t.type==="sale",title=sale?(t.qty+"× "+esc(t.name)):esc(t.cat);
  const meta=esc(t.date)+" · "+(sale?esc(t.platform)+(t.fee?" · platform "+rp(t.fee):"")+(t.tax?" · pajak "+rp(t.tax):""):esc(t.note||"Belanja usaha"));
  const amount=sale?t.qty*t.price-(t.fee||0)-(t.tax||0):t.amount;
  return '<div class="tx-row"><div class="tx-symbol">'+(sale?"↗":"↙")+'</div><div class="tx-main"><div class="tx-title">'+title+'</div><div class="tx-meta">'+meta+'</div><button class="btn del" style="margin:5px 0 0;padding:2px 0" onclick="editRemark(\''+t.id+'\')">Keterangan · '+(t.note?'Edit':'Tambah')+'</button></div><div class="tx-side"><div class="tx-amount '+(sale?"pos":"neg")+'">'+(sale?"+":"−")+rp(amount)+'</div><button class="btn del" onclick="delTx(\''+t.id+'\')">Hapus</button></div></div>';
 }).join(""):'<div class="empty-state"><strong>Belum ada transaksi di kategori ini</strong>Transaksi yang kamu catat akan muncul di sini.</div>';
 $("#app").innerHTML='<header class="page-head"><div><span class="page-kicker">AKTIVITAS USAHA</span><h1 class="page-title">Riwayat</h1><div class="page-subtitle">Pantau semua transaksi yang sudah dicatat.</div></div><span class="page-pill">'+all.length+' transaksi</span></header>'+
 '<div class="metric-grid"><div class="metric-card"><div class="metric-label"><span class="metric-icon">↗</span>Penjualan kotor</div><b class="metric-value">'+rp(sales)+'</b></div><div class="metric-card"><div class="metric-label"><span class="metric-icon">↙</span>Total belanja</div><b class="metric-value">'+rp(buys)+'</b></div></div>'+
 '<div class="section-title"><h2>Semua aktivitas</h2><small>Terbaru dahulu</small></div><div class="page-tabs">'+tabs+'</div><section class="panel-flat">'+rows+'</section>';
}
function delTx(id){if(confirm('Hapus transaksi ini?')){const t=S.tx.find(x=>x.id===id);if(t&&t.rid){const r=S.rec.find(x=>x.id===t.rid)||S.staff.find(x=>x.id===t.rid);if(r){r.skip=r.skip||[];r.skip.push(t.rm)}}S.tx=S.tx.filter(x=>x.id!==id);save();render()}}
function editRemark(id){
 const t=S.tx.find(x=>x.id===id);if(!t)return;
 open(hd('Keterangan transaksi')+`<label>Keterangan (opsional)</label><textarea id="remark" rows="4" style="width:100%;min-height:110px;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);font:inherit">${esc(t.note||"")}</textarea><button class="btn full" style="margin-top:16px" onclick="saveRemark('${id}')">Simpan keterangan</button>`);
}
function saveRemark(id){const t=S.tx.find(x=>x.id===id);if(!t)return;t.note=$("#remark").value.trim();save();close();render()}

function report(){
 const [y,mo]=rep.split("-").map(Number),months=[];
 for(let i=5;i>=0;i--){const d=new Date(y,mo-1-i,1);months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
 const data=months.map(m=>calc(inMonth(m))),mx=Math.max(1,...data.map(d=>Math.max(d.net,Math.abs(d.profit))));
 const M=calc(inMonth(rep)),gk=M.net-(M.by["Bahan baku"]||0)-(M.by["Kemasan & perlengkapan"]||0);
 const other=S.cats.filter(c=>c!=="Bahan baku"&&c!=="Kemasan & perlengkapan"),pct=M.net>0?Math.round(gk/M.net*100):0;
 const row=(a,b,cls)=>'<div class="breakdown-row '+(cls||"")+'"><span>'+a+'</span><b>'+b+'</b></div>';
 $("#app").innerHTML='<header class="page-head"><div><span class="page-kicker">ANALISIS KEUANGAN</span><h1 class="page-title">Laporan</h1><div class="page-subtitle">Lihat performa dan kesehatan usaha.</div></div><span class="page-pill">Bulanan</span></header>'+
 '<section class="panel" style="padding:10px 13px"><div class="row"><button class="btn sec" onclick="shift(-1)">‹</button><b style="font-size:13px">'+MONF[mo-1]+' '+y+'</b><button class="btn sec" onclick="shift(1)">›</button></div></section>'+
 '<section class="report-hero"><div class="eyebrow">ESTIMASI LABA BERSIH</div><div class="value">'+rp(M.profit)+'</div><div class="hint">'+M.porsi+' porsi tercatat · '+MONF[mo-1]+' '+y+'</div><div class="mini"><div><span>Pendapatan bersih</span><b>'+rp(M.net)+'</b></div><div><span>Total belanja</span><b>'+rp(M.buy)+'</b></div></div></section>'+
 '<div class="metric-grid"><div class="metric-card"><div class="metric-label"><span class="metric-icon">🧾</span>Penjualan kotor</div><b class="metric-value">'+rp(M.gross)+'</b></div><div class="metric-card"><div class="metric-label"><span class="metric-icon">🏷️</span>Potongan platform</div><b class="metric-value">'+rp(M.fee)+'</b></div></div>'+
 '<div class="section-title"><h2>Tren 6 bulan</h2><small>Pendapatan & laba</small></div><section class="panel"><div class="report-chart">'+data.map((v,i)=>'<div><div class="bars-pair"><i style="height:'+Math.max(2,v.net/mx*100)+'%;background:var(--pr)"></i><i style="height:'+Math.max(2,Math.max(0,v.profit)/mx*100)+'%;background:var(--gr)"></i></div>'+MON[+months[i].slice(5)-1]+'</div>').join("")+'</div><div class="report-legend"><span><i class="legend-dot"></i>Pendapatan bersih</span><span><i class="legend-dot profit"></i>Laba bersih</span></div></section>'+
 '<div class="section-title"><h2>Rincian laba rugi</h2><small>'+MONF[mo-1]+' '+y+'</small></div><section class="panel">'+
 row("Penjualan kotor",rp(M.gross))+row("Potongan platform","−"+rp(M.fee))+row("Pendapatan bersih sebelum pajak",rp(M.net),"total")+row("Pajak dipotong dari penjualan","−"+rp(M.tax))+row("Uang diterima",rp(M.cash),"total")+
 row("Bahan baku","−"+rp(M.by["Bahan baku"]||0))+row("Kemasan & perlengkapan","−"+rp(M.by["Kemasan & perlengkapan"]||0))+
 row("Laba kotor ("+pct+"%)",rp(gk),"total")+other.map(c=>row(esc(c),"−"+rp(M.by[c]||0))).join("")+
 row("Laba bersih",rp(M.profit),"total "+(M.profit<0?"neg":"pos"))+'</section><p class="filter-note">Perhitungan mengikuti transaksi yang sudah tersimpan. Potongan platform dihitung terpisah dari belanja.</p>';
}
function shift(n){const [y,m]=rep.split("-").map(Number);const d=new Date(y,m-1+n,1);rep=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
function manage(){
 const theme=localStorage.getItem("lcm-theme")||"light";
 const item=(ico,title,desc,action,label)=>'<div class="manage-item"><span class="manage-icon">'+ico+'</span><div class="manage-copy"><b>'+title+'</b><small>'+desc+'</small></div><button class="btn sec" onclick="'+action+'">'+(label||"Kelola")+'</button></div>';
 const products=S.products.map(p=>'<div class="manage-item"><span class="manage-icon item-icon">'+(/minum|kopi|teh|jus|es/i.test(p.name)?"🥤":/makan|nasi|ayam|roti|kue|snack/i.test(p.name)?"🍱":"📦")+'</span><div class="manage-copy"><b>'+esc(p.name)+'</b><small>Jual '+rp(p.price)+' · HPP '+rp(p.cost)+'</small></div><button class="btn sec" onclick="editProd(\''+p.id+'\')">Edit</button></div>').join("");
 const plats=S.platforms.map(p=>'<div class="manage-item"><span class="manage-icon item-icon">'+(/shopee/i.test(p.name)?"🛍️":/gofood/i.test(p.name)?"🟢":/grab/i.test(p.name)?"🛵":/whatsapp/i.test(p.name)?"💬":"🌐")+'</span><div class="manage-copy"><b>'+esc(p.name)+'</b><small>Potongan '+p.fee+'%</small></div><button class="btn sec" onclick="editPlat(\''+p.id+'\')">Edit</button></div>').join("");
 const rec=S.rec.map(r=>'<div class="manage-item"><span class="manage-icon item-icon">🔁</span><div class="manage-copy"><b>'+esc(r.name)+'</b><small>'+rp(r.amount)+' · tiap tanggal '+r.day+'</small></div><button class="btn sec" onclick="editRec(\''+r.id+'\')">Edit</button></div>').join("");
 const staff=S.staff.map(x=>'<div class="manage-item"><span class="manage-icon item-icon">👤</span><div class="manage-copy"><b>'+esc(x.name)+'</b><small>'+rp(x.salary)+' · tiap tanggal '+x.day+'</small></div><button class="btn sec" onclick="editStaff(\''+x.id+'\')">Edit</button></div>').join("");
 const prices=S.prices.map(p=>{const l=p.h[p.h.length-1];return '<div class="manage-item"><span class="manage-icon item-icon">🧾</span><div class="manage-copy"><b>'+esc(p.name)+'</b><small>'+rp(l.price)+'/'+esc(p.unit)+' · '+l.date+'</small></div><button class="btn sec" onclick="editPrice(\''+p.id+'\')">Update</button></div>'}).join("");
 $("#app").innerHTML='<header class="page-head"><div><span class="page-kicker">PENGATURAN USAHA</span><h1 class="page-title">Kelola</h1><div class="page-subtitle">Atur kebutuhan operasional dan data usahamu.</div></div><span class="page-pill">Pengaturan</span></header>'+
 '<section class="panel"><div class="manage-item" style="padding-top:2px"><span class="manage-icon">🏪</span><div class="manage-copy"><b>Identitas usaha</b><small>Nama yang tampil di beranda</small></div></div><label>Nama usaha / pemilik</label><input value="'+esc(S.name)+'" onchange="S.name=this.value;save();render()"></section>'+
 '<div class="manage-group">Produk & penjualan</div><section class="panel">'+item("📦","Produk & HPP",S.products.length+" produk · atur harga jual dan modal","editProd()","Tambah")+(products||'<div class="empty-state">Belum ada produk.</div>')+'</section>'+
 '<section class="panel">'+item("🛵","Platform & potongan",S.platforms.length+" platform · atur biaya layanan","editPlat()","Tambah")+plats+'</section>'+
 '<section class="panel"><div class="manage-item" style="padding-top:2px"><span class="manage-icon">🧺</span><div class="manage-copy"><b>Kategori belanja</b><small>Kelompokkan pengeluaran usaha</small></div><button class="btn sec" onclick="addCat()">Tambah</button></div><div class="chips">'+S.cats.map(c=>'<span class="chip">'+esc(c)+'</span>').join("")+'</div></section>'+
 '<div class="manage-group">Operasional usaha</div><section class="panel">'+item("🔁","Biaya rutin otomatis",S.rec.length+" biaya rutin terjadwal","editRec()","Tambah")+(rec||'<div class="empty-state">Belum ada biaya rutin.</div>')+'</section>'+
 '<section class="panel">'+item("👥","Karyawan & gaji",S.staff.length+" karyawan terdaftar","editStaff()","Tambah")+(staff||'<div class="empty-state">Belum ada karyawan.</div>')+'</section>'+
 '<section class="panel">'+item("🧾","Harga bahan",S.prices.length+" bahan dipantau","editPrice()","Tambah")+(prices||'<div class="empty-state">Belum ada riwayat harga bahan.</div>')+'</section>'+
 '<div class="manage-group">Keuangan & pajak</div><section class="panel">'+item("🧾","Kewajiban pajak",S.tax.length+" catatan pajak · kelola tagihan dan pembayaran","editTax()","Tambah")+taxSummaryHtml()+'</section>'+
 '<div class="manage-group">Tampilan & data</div><section class="panel"><div class="manage-item" style="padding-top:2px"><span class="manage-icon">🎨</span><div class="manage-copy"><b>Tampilan aplikasi</b><small>Pilih mode sesuai kenyamananmu</small></div></div><div class="settings-theme" id="th"><button class="'+(theme==="auto"?"on":"")+'" onclick="setTheme(\'auto\')">Otomatis</button><button class="'+(theme==="light"?"on":"")+'" onclick="setTheme(\'light\')">Terang</button><button class="'+(theme==="dark"?"on":"")+'" onclick="setTheme(\'dark\')">Gelap</button></div></section>'+
 '<section class="panel">'+item("📤","Ekspor laporan","Salin seluruh transaksi ke format CSV","openCsv()","Ekspor")+item("💾","Cadangkan & pulihkan","Simpan atau pulihkan data dari kode cadangan","openBackup()","Buka")+'</section>'+
 '<button class="btn del full" onclick="if(confirm(\'Hapus semua data?\')){S=JSON.parse(JSON.stringify(def));save();render()}">Hapus semua data</button>';
}
function shut(){$('#sheet').classList.remove('show')}
document.close=()=>shut();
function norm(){S.products=S.products||[];S.platforms=S.platforms||[];S.tx=S.tx||[];S.rec=S.rec||[];S.staff=S.staff||[];S.prices=S.prices||[];S.tax=S.tax||[];S.cats=S.cats||[];['Transportasi','Gaji karyawan'].forEach(c=>{if(!S.cats.includes(c))S.cats.push(c)})}
function allRec(){return[...S.rec,...S.staff.map(s=>({id:s.id,name:'Gaji '+s.name,amount:s.salary,cat:'Gaji karyawan',day:s.day,start:s.start,skip:s.skip}))]}
function applyRec(){
 norm();const now=today(),cm=now.slice(0,7),dn=+now.slice(8);let ch=false;
 allRec().forEach(r=>{
  let[y,m]=r.start.split('-').map(Number);
  for(;;){
   const k=y+'-'+String(m).padStart(2,'0');if(k>cm)break;
   const d=Math.min(r.day,28);
   if((k<cm||dn>=d)&&!(r.skip||[]).includes(k)&&!S.tx.some(t=>t.rid===r.id&&t.rm===k)){S.tx.push({id:uid(),type:'buy',date:k+'-'+String(d).padStart(2,'0'),cat:r.cat,amount:r.amount,note:r.name+' (otomatis)',rid:r.id,rm:k});ch=true}
   m++;if(m>12){m=1;y++}
  }
 });
 if(ch)save();
}
function extraHtml(){
 const pr=S.prices.map(p=>{const l=p.h[p.h.length-1],v=p.h[p.h.length-2],c=v?Math.round((l.price-v.price)/v.price*100):0;
  return `<div class='li'><div>${esc(p.name)}<small>${rp(l.price)}/${esc(p.unit)} · ${l.date} ${v?(c>0?`<span class='neg'>naik ${c}%</span>`:c<0?`turun ${-c}%`:'tetap'):''}</small></div><button class='btn sec' data-i='${p.id}' onclick='editPrice(this.dataset.i)'>Update</button></div>`}).join('');
 const rc=S.rec.map(r=>`<div class='li'><div>${esc(r.name)}<small>Tiap tgl ${r.day} · ${esc(r.cat)}</small></div><div><b>${rp(r.amount)}</b> <button class='btn sec' data-i='${r.id}' onclick='editRec(this.dataset.i)'>✎</button></div></div>`).join('');
 const st=S.staff.map(s=>`<div class='li'><div>${esc(s.name)}<small>Gaji tiap tgl ${s.day}</small></div><div><b>${rp(s.salary)}</b> <button class='btn sec' data-i='${s.id}' onclick='editStaff(this.dataset.i)'>✎</button></div></div>`).join('');

  S.tx.push({id:uid(),type:"sale",date:F.date,name:p.name,qty:F.qty,price,cost:p.cost,platform:pl.name,fee,tax,taxMode:F.taxMode||"none",taxRate:F.taxMode==="percent"?Math.min(100,F.taxValue||0):0,note:F.note||""});
 }else{
  if(!F.amount)return alert("Isi nominal belanja");
  S.tx.push({id:uid(),type:"buy",date:F.date,cat:F.cat,amount:F.amount,note:F.note||""});
 }
 save();close();render();
}

 if(!r.ok){const e=new Error((j&&(j.msg||j.error_description||j.message))||('Error '+r.status));e.status=r.status;throw e}
 return j;
}
function setSes(j){ses={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user?j.user.id:ses.uid,email:j.user?j.user.email:ses.email};ls(SK,JSON.stringify(ses))}
async function ensure(){
 if(!ses||ses.exp-Date.now()>60000)return;
 try{setSes(await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:ses.rt})},false))}
 catch(e){if(e.status>=400&&e.status<500){ses=null;ls(SK,null);stat('none');showLogin('Sesi berakhir, silakan masuk lagi.')}throw e}
}
async function pull(){const r=await api('/rest/v1/books?app=eq.'+APP+'&select=data,updated_at',{},true);return r&&r[0]||null}
async function push(){
 const at=new Date().toISOString();
 await api('/rest/v1/books',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:ses.uid,app:APP,data:S,updated_at:at})},true);
 ls(MK,JSON.stringify({uid:ses.uid,at}));ls(DK,null);
}
function take(row){S=row.data;if(typeof norm==='function')norm();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}ls(MK,JSON.stringify({uid:ses.uid,at:row.updated_at}));ls(DK,null);render()}
async function syncNow(){
 if(!ses){showLogin();return}
 if(busy)return;busy=true;stat('wait');
 try{
  const row=await pull(),mk=JSON.parse(ls(MK)||'null'),dirty=ls(DK)==='1';
  if(!row||!row.data||!Array.isArray(row.data.tx)){await push()}
  else{
   const same=mk&&mk.uid===ses.uid&&Date.parse(mk.at)===Date.parse(row.updated_at);
   if(same){if(dirty)await push()}
   else if(!mk||mk.uid!==ses.uid){
    const has=S.tx&&S.tx.length>0;
    if(has&&!confirm('Akun ini sudah punya data tersimpan. OK = pakai data akun (data di HP ini diganti). Batal = pakai data HP ini dan timpa data akun.'))await push();
    else take(row);
   }else{if(dirty)await push();else take(row)}
  }
  stat('ok');
 }catch(e){stat(!ses?'none':(navigator.onLine?'err':'off'))}
 busy=false;
}
async function push2(){if(!ses)return;try{await push();stat('ok')}catch(e){stat(ses?(navigator.onLine?'err':'off'):'none')}}
window.cloudPush=function(){if(!ses)return;ls(DK,'1');stat('wait');clearTimeout(timer);timer=setTimeout(push2,1500)};
window.cloudSync=syncNow;
window.hideLg=()=>lg.classList.remove('show');
window.skipLg=()=>{ls(XK,'1');lg.classList.remove('show')};
window.doLogout=()=>{ses=null;ls(SK,null);ls(MK,null);ls(DK,null);lg.classList.remove('show');stat('none')};
const SEC="background:none;color:var(--tx);border:1px solid var(--pl,var(--ln,#ddd))";
function showLogin(msg){
 lg.innerHTML=`<div><h2>Masuk untuk simpan data online</h2><div style='opacity:.7;font-size:14px'>Data tersimpan di akun, jadi aman saat ganti HP.</div><label>Email</label><input id='lge' type='email' autocomplete='email'><label>Password (min. 6 karakter)</label><input id='lgp' type='password' autocomplete='current-password'><div class='e' id='lgm'>${msg||''}</div><button class='btn' style='width:100%' onclick='doAuth(0)'>Masuk</button><button class='btn' style='width:100%;margin-top:10px;${SEC}' onclick='doAuth(1)'>Daftar akun baru</button><button style='display:block;margin:16px auto 0;background:none;border:0;color:var(--mu);font-size:14px' onclick='skipLg()'>Lanjut tanpa login</button></div>`;
 lg.classList.add('show');
}
function showAcc(){
 lg.innerHTML=`<div><h2>Akun</h2><div style='opacity:.8;margin-bottom:14px'>${ses.email||''}</div><button class='btn' style='width:100%' onclick='cloudSync();hideLg()'>Sinkron sekarang</button><button class='btn' style='width:100%;margin-top:10px;${SEC}' onclick='doLogout()'>Keluar</button><button style='display:block;margin:16px auto 0;background:none;border:0;color:var(--mu);font-size:14px' onclick='hideLg()'>Tutup</button></div>`;
 lg.classList.add('show');
}
window.doAuth=async function(signup){
 const email=$i('lge').value.trim(),pw=$i('lgp').value,m=$i('lgm');
 if(!email||pw.length<6){m.textContent='Isi email dan password (min. 6 karakter)';return}
 m.textContent='Memproses...';
 try{
  const j=await api(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pw})},false);
  if(!j||!j.access_token){m.textContent='Akun dibuat. Cek email untuk konfirmasi, lalu masuk.';return}
  setSes(j);lg.classList.remove('show');await syncNow();
 }catch(e){m.textContent=/invalid login/i.test(e.message)?'Email atau password salah':e.message}
};
window.cloudInit=function(){
 const st=document.createElement('style');
 st.textContent='#cl{display:block;margin:0 0 8px auto;border:1px solid var(--pl,var(--ln,#ddd));background:var(--card,var(--sf,#fff));color:var(--tx);border-radius:999px;padding:5px 12px;font:12px system-ui,sans-serif;cursor:pointer}#lg{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}#lg.show{display:flex}#lg>div{width:100%;max-width:380px}#lg h2{margin:0 0 6px}#lg .e{color:#c0392b;font-size:13px;min-height:18px;margin:8px 0}';
 document.head.appendChild(st);
 pill=document.createElement('button');pill.id='cl';pill.onclick=()=>ses?(ls(DK)==='1'?syncNow():showAcc()):showLogin();
 document.body.insertAdjacentElement('afterbegin',pill);
 lg=document.createElement('div');lg.id='lg';document.body.appendChild(lg);
 addEventListener('online',()=>{if(ses&&ls(DK)==='1')push2()});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ses)syncNow()});
 if(ses){stat('wait');syncNow()}else{stat('none');if(!ls(XK))showLogin()}
};
})();


/* Touch navigation between main sections */
(function(){
 const order=["home","list","rep","mgr"];
 let sx=0,sy=0,started=false;
 const app=document.getElementById("app");
 if(!app)return;
 app.addEventListener("touchstart",function(e){
  if(!e.touches||e.touches.length!==1||document.getElementById("sheet").classList.contains("show")){started=false;return}
  const t=e.touches[0];
  if(e.target.closest("input,textarea,select,[contenteditable='true']")){started=false;return}
  sx=t.clientX;sy=t.clientY;started=true;
 },{passive:true});
 app.addEventListener("touchend",function(e){
  if(!started||!e.changedTouches||!e.changedTouches.length)return;
  started=false;
  if(document.getElementById("sheet").classList.contains("show"))return;
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.25)return;
  const current=order.indexOf(tab);
  if(current<0)return;
  const next=current+(dx<0?1:-1);
  if(next<0||next>=order.length)return;
  tab=order[next];render();
 },{passive:true});
})();

render();
initTheme();
cloudInit();
</script>
